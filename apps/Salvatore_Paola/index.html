<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Salvatore e Paola - mARasense</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
      background: transparent !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
    }

    body > video:not(#playerVideo) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background: transparent !important;
      transform: scale(1.02);
      transform-origin: center center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 18px;
      background: radial-gradient(circle at center, rgba(30, 20, 30, .96) 0%, rgba(0,0,0,.96) 75%);
    }

    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,.94);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      color: #8a4f6a;
    }

    .sub {
      font-size: 14px;
      margin-top: 10px;
      color: #3d2633;
      line-height: 1.45;
    }

    .btn {
      margin-top: 15px;
      border: none;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(90deg, #8a4f6a, #d6b45a);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,.20);
    }

    .scan-layer {
      position: fixed;
      inset: 0;
      z-index: 18;
      pointer-events: none;
      display: none;
      background: transparent;
    }

    .scan-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 340px);
      height: min(58vh, 460px);
      transform: translate(-50%, -50%);
      border: 2px solid rgba(214,180,90,.85);
      border-radius: 24px;
      box-shadow:
        0 0 22px rgba(214,180,90,.18),
        inset 0 0 18px rgba(138,79,106,.18);
      overflow: hidden;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #d6b45a, #8a4f6a, #d6b45a, transparent);
      box-shadow: 0 0 18px rgba(214,180,90,.75);
      animation: scanMove 1.6s ease-in-out infinite;
    }

    @keyframes scanMove {
      0% { top: 6%; }
      50% { top: 92%; }
      100% { top: 6%; }
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      z-index: 19;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,.52);
      padding: 10px 14px;
      border-radius: 12px;
      white-space: nowrap;
      display: none;
      backdrop-filter: blur(4px);
    }

    .video-layer {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
    }

    .video-wrap {
      width: min(86vw, 430px);
      aspect-ratio: 9 / 16;
      opacity: 0;
      transform: scale(0.82);
      transition: all 0.32s ease;
      pointer-events: none;
    }

    .video-wrap.show {
      opacity: 1;
      transform: scale(1);
    }

    #playerVideo {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: contain;
      background: transparent;
      display: block;
    }
  </style>
</head>

<body>

  <div class="overlay" id="ui">
    <div class="card">
      <div class="title">Salvatore & Paola</div>
      <div class="sub">
        Premi Avvia esperienza e inquadra una delle pagine. Quando viene riconosciuta, partirà il video dedicato.
      </div>
      <button class="btn" id="startBtn">Avvia esperienza</button>
    </div>
  </div>

  <div class="scan-layer" id="scanLayer">
    <div class="scan-box">
      <div class="scan-line"></div>
    </div>
  </div>

  <div class="hint" id="hint">Inquadra una pagina della rivista</div>

  <div class="video-layer" id="videoLayer">
    <div class="video-wrap" id="videoWrap">
      <video
        id="playerVideo"
        playsinline
        webkit-playsinline
        preload="auto"
      ></video>
    </div>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart:false; uiLoading:no; uiScanning:no; uiError:no;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; colorManagement:true;"
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="t0" mindar-image-target="targetIndex:0"></a-entity>
    <a-entity id="t1" mindar-image-target="targetIndex:1"></a-entity>
    <a-entity id="t2" mindar-image-target="targetIndex:2"></a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById("startBtn");
    const ui = document.getElementById("ui");
    const hint = document.getElementById("hint");
    const scanLayer = document.getElementById("scanLayer");

    const scene = document.getElementById("scene");

    const videoLayer = document.getElementById("videoLayer");
    const videoWrap = document.getElementById("videoWrap");
    const playerVideo = document.getElementById("playerVideo");

    const t0 = document.getElementById("t0");
    const t1 = document.getElementById("t1");
    const t2 = document.getElementById("t2");

    const videoMap = {
      0: "./assets/video/proposta.mp4",
      1: "./assets/video/salvatore.mp4",
      2: "./assets/video/videosposi.mp4"
    };

    let playing = false;

    async function unlockVideo() {
      try {
        playerVideo.muted = true;
        playerVideo.src = videoMap[0];
        playerVideo.load();
        await playerVideo.play();
        playerVideo.pause();
        playerVideo.currentTime = 0;
        playerVideo.muted = false;
      } catch (e) {
        console.log("unlock video warning", e);
      }
    }

    function showScanner() {
      hint.style.display = "block";
      scanLayer.style.display = "block";
    }

    function hideScanner() {
      hint.style.display = "none";
      scanLayer.style.display = "none";
    }

    function showVideo() {
      hideScanner();
      videoLayer.style.display = "flex";
      requestAnimationFrame(() => {
        videoWrap.classList.add("show");
      });
    }

    function hideVideo() {
      videoWrap.classList.remove("show");
      setTimeout(() => {
        videoLayer.style.display = "none";
      }, 220);
    }

    async function playExperience(index) {
      if (playing) return;

      playing = true;

      playerVideo.pause();
      playerVideo.currentTime = 0;
      playerVideo.muted = false;
      playerVideo.src = videoMap[index];
      playerVideo.load();

      showVideo();

      try {
        await playerVideo.play();
      } catch (e) {
        console.log("play error", e);

        document.body.addEventListener("click", async () => {
          try {
            playerVideo.muted = false;
            await playerVideo.play();
          } catch (err) {
            console.log("play after tap error", err);
          }
        }, { once: true });
      }
    }

    function resetExperience() {
      playing = false;

      playerVideo.pause();
      playerVideo.currentTime = 0;

      hideVideo();
      showScanner();
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Avvio...";

      await unlockVideo();

      const startAR = async () => {
        await scene.systems["mindar-image-system"].start();
        ui.style.display = "none";
        showScanner();
      };

      if (scene.hasLoaded) {
        startAR();
      } else {
        scene.addEventListener("loaded", startAR, { once: true });
      }
    };

    t0.addEventListener("targetFound", () => playExperience(0));
    t1.addEventListener("targetFound", () => playExperience(1));
    t2.addEventListener("targetFound", () => playExperience(2));

    playerVideo.addEventListener("ended", () => {
      resetExperience();
    });
  </script>

</body>
</html>
