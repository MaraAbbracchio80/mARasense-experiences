<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Piazza Italia – AR Experience</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #111111, #000000);
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 25%, rgba(255,255,255,.10), rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #111111, #000000);
    }

    .card {
      width: min(520px, 100%);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.28);
      backdrop-filter: blur(10px);
      color: #fff;
    }

    .title {
      margin: 2px 0 8px;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 14px;
      color: rgba(255,255,255,.78);
      line-height: 1.45;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      background: rgba(255,255,255,.95);
      color: #111;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }

    .btn.primary {
      background: linear-gradient(90deg, #19d8ff, #9d6bff);
      color: #fff;
    }

    .pill {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      z-index: 30;
      pointer-events: none;
    }

    .badge {
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      color: rgba(255,255,255,.88);
      font-size: 13px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
    }

    .badge strong {
      font-weight: 900;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="pill">
    <div class="badge" id="status"><strong>AR</strong> Pronto ✨</div>
    <div class="badge hidden" id="page">Target: —</div>
  </div>

  <div class="overlay" id="ui">
    <div class="card">
      <div class="title">Piazza Italia AR Experience</div>
      <div class="sub">
        Tocca “Avvia esperienza”, consenti la fotocamera, poi inquadra il target sulla maglietta.
      </div>

      <div class="row">
        <button class="btn primary" id="startBtn">Avvia esperienza</button>
        <button class="btn" id="helpBtn">Come funziona</button>
      </div>

      <div class="sub" style="margin-top:10px; font-size:12.5px;">
        Consiglio: luce buona + target fermo per 1–2 secondi.
      </div>
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; uiLoading: no; uiError: no;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <video
        id="v0"
        crossorigin="anonymous"
        src="assets/video/Piazza-Italia.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        muted
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        width="1"
        height="1"
        material="shader: flat; src: #v0"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");
    const helpBtn = document.getElementById("helpBtn");
    const status = document.getElementById("status");
    const page = document.getElementById("page");
    const scene = document.querySelector("a-scene");
    const video = document.getElementById("v0");

    let active = false;

    function setStatus(text) {
      status.textContent = "AR " + text;
    }

    function showPage(name) {
      page.classList.remove("hidden");
      page.textContent = "Target: " + name;
    }

    function hidePage() {
      page.classList.add("hidden");
      page.textContent = "Target: —";
    }

    function stopVideo() {
      try {
        video.pause();
        video.currentTime = 0;
      } catch (e) {}
    }

    async function unlockVideo() {
      try {
        video.muted = true;
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch (e) {}
    }

    const audioBtn = document.createElement("button");
    audioBtn.className = "btn";
    audioBtn.textContent = "Attiva audio";
    audioBtn.style.position = "fixed";
    audioBtn.style.bottom = "14px";
    audioBtn.style.left = "50%";
    audioBtn.style.transform = "translateX(-50%)";
    audioBtn.style.zIndex = "40";
    audioBtn.style.display = "none";
    document.body.appendChild(audioBtn);

    audioBtn.addEventListener("click", async () => {
      if (!active) return;
      video.muted = false;
      try {
        await video.play();
      } catch (e) {}
      audioBtn.style.display = "none";
    });

    helpBtn.addEventListener("click", () => {
      alert("1) Tocca 'Avvia esperienza'\n2) Consenti la fotocamera\n3) Inquadra il target sulla maglietta");
    });

    startBtn.addEventListener("click", async () => {
      await unlockVideo();
      await scene.systems["mindar-image-system"].start();
      ui.style.display = "none";
      setStatus("Inquadra il target ✨");
    });

    const target = document.querySelector('[mindar-image-target="targetIndex: 0"]');

    target.addEventListener("targetFound", async () => {
      active = true;
      showPage("Piazza Italia");
      stopVideo();

      video.muted = true;
      try {
        await video.play();
      } catch (e) {}

      audioBtn.style.display = "inline-block";
      setStatus("Target trovato ✅");
    });

    target.addEventListener("targetLost", () => {
      active = false;
      hidePage();
      audioBtn.style.display = "none";
      stopVideo();
      setStatus("Target perso");
    });
  </script>

</body>
</html>
