<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Piazza Italia AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      background: linear-gradient(#111111, #000000);
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
      background: linear-gradient(180deg, #161616 0%, #000000 100%);
    }

    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 22px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.26);
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
    }

    .sub {
      font-size: 14px;
      margin-top: 10px;
      color: rgba(255,255,255,.82);
      line-height: 1.45;
    }

    .btn {
      margin-top: 15px;
      border: none;
      border-radius: 999px;
      padding: 12px 18px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(90deg, #19d8ff, #9d6bff);
      color: white;
      box-shadow: 0 10px 24px rgba(0,0,0,.18);
    }

    .video-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 25;
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding-top: 8vh;
      pointer-events: none;
    }

    .video-wrap {
      width: min(80vw, 380px);
      aspect-ratio: 9/16;
      opacity: 0;
      transform: scale(0.75);
      transition: all 0.4s ease;
      pointer-events: auto;
    }

    .video-wrap.show {
      opacity: 1;
      transform: scale(1);
    }

    #playerVideo {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: contain;
      background: black;
      box-shadow: 0 18px 40px rgba(0,0,0,.35);
    }
  </style>
</head>

<body>

<div class="overlay" id="ui">
  <div class="card">
    <div class="title">Piazza Italia AR</div>
    <div class="sub">Inquadra il target sulla maglietta per vedere il video</div>
    <button class="btn" id="startBtn">Avvia esperienza</button>
  </div>
</div>

<div class="video-layer" id="videoLayer">
  <div class="video-wrap" id="videoWrap">
    <video id="playerVideo" playsinline webkit-playsinline preload="auto" controls></video>
  </div>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart:false;"
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false">

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <a-entity id="t0" mindar-image-target="targetIndex:0"></a-entity>
</a-scene>

<script>
const startBtn = document.getElementById("startBtn");
const ui = document.getElementById("ui");

const videoLayer = document.getElementById("videoLayer");
const videoWrap = document.getElementById("videoWrap");
const playerVideo = document.getElementById("playerVideo");

const scene = document.querySelector("a-scene");
const t0 = document.getElementById("t0");

const videoMap = {
  0: "assets/video/Piazza-Italia.mp4"
};

let playing = false;

function showVideo() {
  videoLayer.style.display = "flex";
  requestAnimationFrame(() => videoWrap.classList.add("show"));
}

function hideVideo() {
  videoWrap.classList.remove("show");
  setTimeout(() => {
    videoLayer.style.display = "none";
  }, 200);
}

async function playVideo(index) {
  if (playing) return;

  playing = true;

  playerVideo.src = videoMap[index];
  playerVideo.load();

  showVideo();

  try {
    await playerVideo.play();
  } catch (e) {
    console.log("play error", e);
  }
}

function reset() {
  playing = false;
  playerVideo.pause();
  playerVideo.currentTime = 0;
  hideVideo();
}

startBtn.onclick = async () => {
  await scene.systems["mindar-image-system"].start();
  ui.style.display = "none";
};

t0.addEventListener("targetFound", () => playVideo(0));

t0.addEventListener("targetLost", () => {
  if (!playerVideo.paused) return;
  reset();
});

playerVideo.addEventListener("ended", () => {
  reset();
});
</script>

</body>
</html>
