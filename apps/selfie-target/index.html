<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Selfie AR</title>

  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #hint {
      position: fixed;
      top: 60px;
      left: 14px;
      right: 14px;
      z-index: 9999;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(0,0,0,0.62);
      border: 1px solid rgba(255,255,255,0.22);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 800;
    }

    #manualSelfieBtn {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 99999;
      border: none;
      border-radius: 18px;
      padding: 15px 22px;
      font-size: 16px;
      font-weight: 900;
      color: white;
      background: linear-gradient(90deg, #1fd7ff, #78b8ff);
      box-shadow: 0 10px 28px rgba(0,0,0,0.42);
      cursor: pointer;
      display: block;
    }
  </style>
</head>

<body>
  <div id="hint">
    Inquadra la maglia, poi tocca Selfie.
  </div>

  <button id="manualSelfieBtn" onclick="location.href='../selfie/index.html?player=dilorenzo'">
    Selfie con il giocatore
  </button>

  <script src="bundle.js"></script>
</body>
</html>
