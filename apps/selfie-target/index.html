<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Selfie AR - Di Lorenzo</title>

  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #000;
    }

    #hint {
      position: fixed;
      top: 70px;
      left: 18px;
      right: 18px;
      z-index: 9999;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(0,0,0,0.62);
      border: 1px solid rgba(255,255,255,0.20);
      color: white;
      text-align: center;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    #selfieBtn {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      border: none;
      border-radius: 18px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 900;
      color: white;
      background: linear-gradient(90deg, #1fd7ff, #78b8ff);
      box-shadow: 0 10px 28px rgba(0,0,0,0.42), 0 0 18px rgba(29,216,255,0.32);
      cursor: pointer;
    }

    #selfieBtn:active {
      transform: translateX(-50%) scale(0.96);
    }

    #backBtn {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 9999;
      padding: 10px 13px;
      border-radius: 14px;
      background: rgba(0,0,0,0.62);
      border: 1px solid rgba(255,255,255,0.20);
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }
  </style>
</head>

<body>
  <a id="backBtn" href="../../index.html">← Demo</a>

  <div id="hint">
    Inquadra la maglia di Di Lorenzo per attivare il selfie.
  </div>

  <button id="selfieBtn">
    Selfie con Di Lorenzo
  </button>

  <script src="bundle.js"></script>
</body>
</html>
