<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Selfie Target</title>

  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial;
    }

    #hint {
      position: fixed;
      top: 60px;
      left: 10px;
      right: 10px;
      z-index: 9999;
      padding: 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.6);
      color: white;
      text-align: center;
      font-weight: bold;
    }

    #selfieBtn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: none;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      font-weight: bold;
      color: white;
      background: linear-gradient(90deg, #1fd7ff, #78b8ff);
    }
  </style>
</head>

<body>

  <div id="hint">Inquadra una maglia</div>

  <button id="selfieBtn">
    Selfie con il giocatore
  </button>

  <script src="bundle.js"></script>

</body>
</html>
