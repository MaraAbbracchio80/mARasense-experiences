<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Logo 3D</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #0b1020, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: white;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      margin: 0 0 12px 0;
      font-size: 30px;
    }

    #startScreen p {
      margin: 0;
      max-width: 340px;
      line-height: 1.5;
      color: #d7d7d7;
    }

    #startBtn {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      background: linear-gradient(90deg, #00c2ff, #8a2be2);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0,194,255,0.22);
    }

    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      text-align: center;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="startScreen">
    <h1>Logo 3D</h1>
    <p>Premi Avvia esperienza, poi tocca o trascina sullo schermo per far apparire e spostare il logo 3D.</p>
    <button id="startBtn">Avvia esperienza</button>
  </div>

  <div id="hint">Tocca per far apparire il logo, trascina per spostarlo</div>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>
  <audio id="moveAudio" preload="auto" src="./assets/audio/sound-effects.mp3"></audio>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    const startBtn = document.getElementById("startBtn");
    const startScreen = document.getElementById("startScreen");
    const hint = document.getElementById("hint");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("threeCanvas");
    const moveAudio = document.getElementById("moveAudio");

    let scene, camera3D, renderer;
    let logoRoot = null;
    let logoModel = null;
    let glowMesh = null;
    let orbitParticles = [];
    let trailParticles = [];

    let started = false;
    let logoReady = false;
    let logoVisible = false;
    let isDragging = false;
    let audioUnlocked = false;

    let targetPos = new THREE.Vector3(0, 0, 0);
    let currentPos = new THREE.Vector3(0, 0, 0);
    let lastTrailPos = new THREE.Vector3(999, 999, 999);
    let lastAudioTime = 0;

    const clock = new THREE.Clock();

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play().then(resolve).catch(resolve);
        };
      });
    }

    async function unlockAudio() {
      try {
        moveAudio.volume = 0.01;
        await moveAudio.play();
        moveAudio.pause();
        moveAudio.currentTime = 0;
        moveAudio.volume = 0.75;
        audioUnlocked = true;
      } catch (e) {
        console.warn("Audio unlock non riuscito:", e);
      }
    }

    async function playMoveSound() {
      if (!audioUnlocked) return;

      const now = performance.now();
      if (now - lastAudioTime < 280) return;
      lastAudioTime = now;

      try {
        moveAudio.pause();
        moveAudio.currentTime = 0;
        moveAudio.volume = 0.75;
        await moveAudio.play();
      } catch (e) {
        console.warn("Play move sound fallito:", e);
      }
    }

    function initThree() {
      scene = new THREE.Scene();

      camera3D = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
      );
      camera3D.position.set(0, 0, 2.8);

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true
      });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x334455, 1.35);
      scene.add(hemi);

      const dir1 = new THREE.DirectionalLight(0xffffff, 1.1);
      dir1.position.set(2, 3, 4);
      scene.add(dir1);

      const dir2 = new THREE.DirectionalLight(0x66ccff, 0.45);
      dir2.position.set(-2, 1, 3);
      scene.add(dir2);

      createGlow();
      createOrbitParticles();
      createTrailParticles();
      loadLogo();

      window.addEventListener("pointerdown", onPointerDown);
      window.addEventListener("pointermove", onPointerMove);
      window.addEventListener("pointerup", onPointerUp);
      window.addEventListener("pointercancel", onPointerUp);
      window.addEventListener("resize", onResize);

      animate();
    }

    function createGlow() {
      const geometry = new THREE.PlaneGeometry(2.1, 2.1);
      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uOpacity: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform float uOpacity;
          void main() {
            vec2 p = vUv - vec2(0.5);
            float d = length(p);
            float glow = smoothstep(0.58, 0.0, d);
            vec3 color = mix(vec3(0.0, 0.8, 1.0), vec3(0.75, 0.95, 1.0), glow);
            gl_FragColor = vec4(color, glow * 0.42 * uOpacity);
          }
        `
      });

      glowMesh = new THREE.Mesh(geometry, material);
      glowMesh.visible = false;
      glowMesh.position.set(0, 0, -0.08);
      scene.add(glowMesh);
    }

    function createOrbitParticles() {
      const particleCount = 32;
      const geometry = new THREE.SphereGeometry(0.015, 8, 8);

      for (let i = 0; i < particleCount; i++) {
        const material = new THREE.MeshBasicMaterial({
          color: i % 3 === 0 ? 0xb8f4ff : 0x66dfff,
          transparent: true,
          opacity: 0.9
        });

        const p = new THREE.Mesh(geometry, material);
        p.visible = false;
        p.userData = {
          angle: Math.random() * Math.PI * 2,
          radius: 0.48 + Math.random() * 0.38,
          speed: 0.35 + Math.random() * 1.1,
          offsetY: (Math.random() - 0.5) * 0.45,
          zWave: 0.02 + Math.random() * 0.12
        };
        scene.add(p);
        orbitParticles.push(p);
      }
    }

    function createTrailParticles() {
      const geometry = new THREE.SphereGeometry(0.012, 8, 8);

      for (let i = 0; i < 54; i++) {
        const material = new THREE.MeshBasicMaterial({
          color: i % 2 === 0 ? 0xb8f4ff : 0x66dfff,
          transparent: true,
          opacity: 0
        });

        const p = new THREE.Mesh(geometry, material);
        p.visible = false;
        p.userData = {
          life: 0,
          decay: 0.022 + Math.random() * 0.018
        };
        scene.add(p);
        trailParticles.push(p);
      }
    }

    function emitTrailParticle(x, y) {
      const p = trailParticles.find(tp => tp.userData.life <= 0);
      if (!p) return;

      p.visible = true;
      p.position.set(
        x + (Math.random() - 0.5) * 0.07,
        y + (Math.random() - 0.5) * 0.07,
        0.03 + Math.random() * 0.12
      );

      const s = 0.65 + Math.random() * 1.1;
      p.scale.setScalar(s);
      p.material.opacity = 0.95;
      p.userData.life = 1;
      p.userData.driftX = (Math.random() - 0.5) * 0.012;
      p.userData.driftY = (Math.random() - 0.5) * 0.012;
      p.userData.driftZ = Math.random() * 0.008;
    }

    function updateTrailParticles() {
      trailParticles.forEach((p) => {
        if (p.userData.life > 0) {
          p.userData.life -= p.userData.decay;
          p.position.x += p.userData.driftX;
          p.position.y += p.userData.driftY;
          p.position.z += p.userData.driftZ;
          p.material.opacity = Math.max(p.userData.life * 0.95, 0);

          const s = Math.max(p.userData.life * 1.2, 0.08);
          p.scale.setScalar(s);

          if (p.userData.life <= 0) {
            p.visible = false;
            p.material.opacity = 0;
          }
        }
      });
    }

    function loadLogo() {
      const loader = new THREE.GLTFLoader();

      loader.load(
        "./assets/models/logo.glb",
        (gltf) => {
          logoRoot = new THREE.Group();
          logoModel = gltf.scene;

          centerAndScaleModel(logoModel, 1.2);

          // Fix asse: logo non più capovolto verticalmente
          logoModel.rotation.x = -Math.PI / 2;
          logoModel.rotation.y = 0;
          logoModel.rotation.z = Math.PI;

          logoRoot.add(logoModel);
          logoRoot.visible = false;
          scene.add(logoRoot);

          logoReady = true;
          hint.style.display = "block";
        },
        undefined,
        (error) => {
          console.error("Errore caricamento logo.glb:", error);
        }
      );
    }

    function centerAndScaleModel(object, targetSize = 1) {
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();

      box.getSize(size);
      box.getCenter(center);

      object.position.sub(center);

      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const scale = targetSize / maxDim;
        object.scale.setScalar(scale);
      }
    }

    function pointerToScene(event) {
      const nx = (event.clientX / window.innerWidth) * 2 - 1;
      const ny = -(event.clientY / window.innerHeight) * 2 + 1;

      return {
        x: nx * 0.95,
        y: ny * 1.35
      };
    }

    function showLogoAt(x, y) {
      if (!logoReady) return;

      targetPos.set(x, y, 0);
      currentPos.copy(targetPos);
      lastTrailPos.copy(targetPos);

      logoRoot.position.copy(currentPos);
      logoRoot.visible = true;
      logoVisible = true;
      logoRoot.scale.set(0.001, 0.001, 0.001);

      glowMesh.position.set(x, y, -0.08);
      glowMesh.visible = true;
      glowMesh.material.uniforms.uOpacity.value = 0;

      orbitParticles.forEach((p) => {
        p.visible = true;
        p.material.opacity = 0.9;
      });

      playMoveSound();
    }

    function onPointerDown(event) {
      if (!logoReady || startScreen.style.display !== "none") return;

      isDragging = true;
      const pos = pointerToScene(event);

      if (!logoVisible) {
        showLogoAt(pos.x, pos.y);
      } else {
        targetPos.set(pos.x, pos.y, 0);
        playMoveSound();
      }
    }

    function onPointerMove(event) {
      if (!logoReady || !logoVisible || !isDragging) return;

      const pos = pointerToScene(event);
      targetPos.set(pos.x, pos.y, 0);

      const dist = currentPos.distanceTo(targetPos);
      if (dist > 0.035) {
        playMoveSound();
      }
    }

    function onPointerUp() {
      isDragging = false;
    }

    function updateOrbitParticles(time) {
      if (!logoRoot || !logoRoot.visible) return;

      orbitParticles.forEach((p, i) => {
        const d = p.userData;
        const a = time * d.speed + d.angle;

        p.position.set(
          currentPos.x + Math.cos(a) * d.radius,
          currentPos.y + Math.sin(a) * d.radius * 0.58 + d.offsetY,
          0.04 + Math.sin(a * 1.2) * d.zWave
        );

        const pulse = 0.55 + Math.sin(time * 2.2 + i) * 0.24;
        p.scale.setScalar(pulse);

        if (p.visible && p.material.opacity > 0.22) {
          p.material.opacity *= 0.997;
        }
      });
    }

    function updateScene(time) {
      if (!logoRoot || !logoRoot.visible) {
        updateTrailParticles();
        return;
      }

      currentPos.lerp(targetPos, 0.12);

      if (currentPos.distanceTo(lastTrailPos) > 0.018) {
        emitTrailParticle(currentPos.x, currentPos.y);
        emitTrailParticle(currentPos.x, currentPos.y);
        lastTrailPos.copy(currentPos);
      }

      logoRoot.position.copy(currentPos);
      glowMesh.position.set(currentPos.x, currentPos.y, -0.08);

      if (logoRoot.scale.x < 1) {
        const s = THREE.MathUtils.lerp(logoRoot.scale.x, 1, 0.09);
        logoRoot.scale.setScalar(s);
      }

      logoRoot.position.y += Math.sin(time * 1.8) * 0.0025;

      // rotazione continua
      logoRoot.rotation.y += 0.015;
      logoRoot.rotation.x = Math.sin(time * 0.8) * 0.06;
      logoRoot.rotation.z = Math.sin(time * 1.1) * 0.02;

      glowMesh.material.uniforms.uOpacity.value = 0.95;
      const glowScale = 1 + Math.sin(time * 2.1) * 0.05;
      glowMesh.scale.set(glowScale, glowScale, glowScale);

      updateOrbitParticles(time);
      updateTrailParticles();
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();
      updateScene(time);

      if (renderer && scene && camera3D) {
        renderer.render(scene, camera3D);
      }
    }

    function onResize() {
      if (!camera3D || !renderer) return;
      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    startBtn.onclick = async function() {
      if (started) return;
      started = true;

      try {
        await startCamera();
        await unlockAudio();
        startScreen.style.display = "none";
        initThree();
      } catch (err) {
        console.error(err);
        started = false;
      }
    };
  </script>
</body>
</html>
