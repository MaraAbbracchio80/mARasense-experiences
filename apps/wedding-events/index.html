<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Wedding & Events - mARasense</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at center, rgba(138,43,226,0.20) 0%, rgba(0,0,0,0) 30%),
        radial-gradient(circle at top, rgba(255,122,0,0.12) 0%, rgba(0,0,0,0) 28%),
        linear-gradient(180deg, #111 0%, #000 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      margin: 0 0 12px 0;
      font-size: 30px;
      letter-spacing: 0.6px;
    }

    #startScreen p {
      margin: 0 0 22px 0;
      font-size: 15px;
      max-width: 360px;
      line-height: 1.6;
      color: #ddd;
    }

    #startButton {
      background: linear-gradient(90deg, #8A2BE2, #ff7a00);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      box-shadow:
        0 0 24px rgba(138, 43, 226, 0.30),
        0 0 32px rgba(255, 122, 0, 0.18);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    #startButton:active {
      transform: scale(0.98);
    }

    #debugBox {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.68);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 92vw;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #scanText {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      z-index: 9998;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.60);
      padding: 10px 14px;
      border-radius: 10px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      display: none;
    }

    #cinemaFlash {
      position: fixed;
      inset: 0;
      z-index: 9997;
      pointer-events: none;
      background:
        radial-gradient(circle at center, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.10) 22%, rgba(255,255,255,0) 58%);
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    #cinemaFlash.show {
      opacity: 1;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 10;
    }

    video {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    canvas {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 2 !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>Wedding & Events</h1>
    <p>
      Premi Avvia esperienza e inquadra il target. Quando viene riconosciuto,
      il contenuto partirà con un ingresso cinematografico.
    </p>
    <button id="startButton">Avvia esperienza</button>
  </div>

  <div id="debugBox">Stato: attesa avvio</div>
  <div id="scanText">Inquadra bene il target</div>
  <div id="cinemaFlash"></div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    color-space="sRGB"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no; uiError: no; autoStart: false;"
  >
    <a-assets>
      <video
        id="eventVideo"
        src="./assets/video/video.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

      <audio
        id="bgAudio"
        src="./assets/audio/tunetank-love-romantic-guitar-music-347184.mp3"
        preload="auto"
        crossorigin="anonymous"
      ></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="smoothWrapper">
        <a-plane
          id="videoPlane"
          src="#eventVideo"
          position="0 0 0"
          width="1"
          height="1.4"
          material="shader: flat; transparent: true; opacity: 0"
          visible="false"
          scale="0.92 0.92 0.92"
        ></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const debugBox = document.getElementById("debugBox");
    const scanText = document.getElementById("scanText");
    const cinemaFlash = document.getElementById("cinemaFlash");

    const sceneEl = document.getElementById("arScene");
    const target0 = document.getElementById("target0");
    const smoothWrapper = document.getElementById("smoothWrapper");
    const videoPlane = document.getElementById("videoPlane");

    const video = document.getElementById("eventVideo");
    const audio = document.getElementById("bgAudio");

    let targetVisible = false;
    let smoothingInitialized = false;
    let videoFinished = false;
    let fadeAudioInterval = null;
    let cinematicFrame = null;
    let cinematicActive = false;

    const smoothed = {
      position: new THREE.Vector3(),
      quaternion: new THREE.Quaternion(),
      scale: new THREE.Vector3(1, 1, 1)
    };

    function setDebug(text) {
      debugBox.textContent = "Stato: " + text;
      console.log(text);
    }

    function showHint(text = "Inquadra bene il target") {
      scanText.textContent = text;
      scanText.style.display = "block";
    }

    function hideHint() {
      scanText.style.display = "none";
    }

    function showVideoPlane() {
      videoPlane.setAttribute("visible", true);
      videoPlane.object3D.visible = true;
    }

    function hideVideoPlane() {
      videoPlane.setAttribute("visible", false);
      videoPlane.object3D.visible = false;
    }

    function stopAudioFade() {
      if (fadeAudioInterval) {
        clearInterval(fadeAudioInterval);
        fadeAudioInterval = null;
      }
    }

    function stopCinematicAnimation() {
      if (cinematicFrame) {
        cancelAnimationFrame(cinematicFrame);
        cinematicFrame = null;
      }
      cinematicActive = false;
    }

    function resetMedia() {
      stopAudioFade();
      stopCinematicAnimation();

      video.pause();
      video.currentTime = 0;

      audio.pause();
      audio.currentTime = 0;
      audio.volume = 0;

      videoPlane.setAttribute("material", "shader: flat; transparent: true; opacity: 0");
      videoPlane.object3D.scale.set(0.92, 0.92, 0.92);

      cinemaFlash.classList.remove("show");
    }

    function fadeInAudio(targetVolume = 0.6, duration = 2200) {
      stopAudioFade();

      const steps = 22;
      const intervalTime = duration / steps;
      const stepAmount = targetVolume / steps;

      audio.volume = 0;

      fadeAudioInterval = setInterval(() => {
        const nextVolume = Math.min(audio.volume + stepAmount, targetVolume);
        audio.volume = nextVolume;

        if (nextVolume >= targetVolume) {
          stopAudioFade();
        }
      }, intervalTime);
    }

    function animateVideoEntrance() {
      stopCinematicAnimation();
      cinematicActive = true;

      const start = performance.now();
      const duration = 900;

      cinemaFlash.classList.add("show");
      setTimeout(() => {
        cinemaFlash.classList.remove("show");
      }, 320);

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function frame(now) {
        if (!cinematicActive) return;

        const elapsed = now - start;
        const t = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(t);

        const opacity = eased;
        const scale = 0.92 + (1 - 0.92) * eased;

        videoPlane.setAttribute("material", "shader: flat; transparent: true; opacity: " + opacity);
        videoPlane.object3D.scale.set(scale, scale, scale);

        if (t < 1) {
          cinematicFrame = requestAnimationFrame(frame);
        } else {
          cinematicFrame = null;
          cinematicActive = false;
          videoPlane.setAttribute("material", "shader: flat; transparent: true; opacity: 1");
          videoPlane.object3D.scale.set(1, 1, 1);
        }
      }

      cinematicFrame = requestAnimationFrame(frame);
    }

    async function playFromStart() {
      try {
        resetMedia();

        await video.play();
        await audio.play();

        fadeInAudio(0.6, 2200);
        animateVideoEntrance();
      } catch (e) {
        console.warn("Errore play media:", e);
      }
    }

    function initializeSmoothing() {
      const targetObj = target0.object3D;
      const wrapperObj = smoothWrapper.object3D;

      smoothed.position.copy(targetObj.position);
      smoothed.quaternion.copy(targetObj.quaternion);
      smoothed.scale.copy(targetObj.scale);

      wrapperObj.position.copy(smoothed.position);
      wrapperObj.quaternion.copy(smoothed.quaternion);
      wrapperObj.scale.copy(smoothed.scale);

      smoothingInitialized = true;
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Avvio...";

      try {
        audio.volume = 0;
        await audio.play();
        audio.pause();
        audio.currentTime = 0;
      } catch (e) {
        console.warn("Pre-attivazione audio non riuscita:", e);
      }

      const startAR = async () => {
        const mindarSystem = sceneEl.systems["mindar-image-system"];

        if (!mindarSystem) {
          setDebug("mindar-image-system non trovato");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
          return;
        }

        try {
          await mindarSystem.start();
          startScreen.style.display = "none";
          showHint();
          hideVideoPlane();
          setDebug("AR avviata. Ricerca target...");
        } catch (err) {
          console.error(err);
          setDebug("errore avvio AR");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
        }
      };

      if (sceneEl.hasLoaded) {
        startAR();
      } else {
        sceneEl.addEventListener("loaded", startAR, { once: true });
      }
    });

    sceneEl.addEventListener("arReady", () => {
      setDebug("MindAR pronto");
    });

    sceneEl.addEventListener("arError", () => {
      setDebug("errore MindAR");
    });

    target0.addEventListener("targetFound", async () => {
      targetVisible = true;
      hideHint();
      initializeSmoothing();

      if (videoFinished) {
        videoFinished = false;
      }

      showVideoPlane();
      setDebug("target trovato");
      await playFromStart();
    });

    target0.addEventListener("targetLost", () => {
      targetVisible = false;
      smoothingInitialized = false;

      resetMedia();
      hideVideoPlane();

      showHint("Target perso. Riinquadra l’immagine.");
      setDebug("target perso");
    });

    video.addEventListener("ended", () => {
      stopAudioFade();
      stopCinematicAnimation();

      video.pause();
      video.currentTime = 0;

      audio.pause();
      audio.currentTime = 0;
      audio.volume = 0;

      videoFinished = true;
      hideVideoPlane();

      if (targetVisible) {
        showHint("Video finito. Esci e rientra sul target per farlo ripartire.");
        setDebug("video terminato");
      }
    });

    sceneEl.addEventListener("renderstart", () => {
      const renderer = sceneEl.renderer;

      renderer.setAnimationLoop(() => {
        renderer.render(sceneEl.object3D, sceneEl.camera);

        if (!targetVisible || !smoothingInitialized) return;

        const targetObj = target0.object3D;
        const wrapperObj = smoothWrapper.object3D;

        const positionLerp = 0.12;
        const rotationLerp = 0.10;
        const scaleLerp = 0.12;

        smoothed.position.lerp(targetObj.position, positionLerp);
        smoothed.quaternion.slerp(targetObj.quaternion, rotationLerp);
        smoothed.scale.lerp(targetObj.scale, scaleLerp);

        wrapperObj.position.copy(smoothed.position);
        wrapperObj.quaternion.copy(smoothed.quaternion);
        wrapperObj.scale.copy(smoothed.scale);
      });
    });

    setInterval(() => {
      if (!targetVisible && startScreen.style.display === "none") {
        showHint();
      }
    }, 800);
  </script>
</body>
</html>
