<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Cirio - mARasense</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #161616 0%, #000 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      margin: 0 0 12px 0;
      font-size: 28px;
    }

    #startScreen p {
      margin: 0 0 20px 0;
      font-size: 15px;
      max-width: 340px;
      line-height: 1.5;
      color: #ddd;
    }

    #startButton {
      background: #8A2BE2;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(138, 43, 226, 0.35);
    }

    #debugBox {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.68);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 92vw;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #scanText {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      z-index: 9998;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.60);
      padding: 10px 14px;
      border-radius: 10px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      z-index: 10;
      background: transparent !important;
    }

    video,
    canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      background: transparent !important;
    }

    video {
      z-index: 1 !important;
      transform: scale(1.04);
      transform-origin: center center;
    }

    canvas,
    .a-canvas {
      z-index: 2 !important;
    }
  </style>
</head>

<body>

  <div id="startScreen">
    <h1>Cirio</h1>

    <p>
      Premi Avvia esperienza e inquadra i prodotti Cirio.
      Quando il target viene riconosciuto partirà il contenuto con audio.
    </p>

    <button id="startButton">
      Avvia esperienza
    </button>
  </div>

  <div id="debugBox">
    Stato: attesa avvio
  </div>

  <div id="scanText">
    Inquadra bene il prodotto
  </div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    color-space="sRGB"
    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiLoading: no;
      uiScanning: no;
      uiError: no;
      autoStart: false;
      filterMinCF: 0.0001;
      filterBeta: 0.001;
      missTolerance: 5;
      warmupTolerance: 5;
    "
  >

    <a-assets>

      <!-- VIDEO OLIO -->

      <video
        id="videoOlio"
        src="./assets/video/videoolio.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

      <!-- VIDEO PIZZA -->

      <video
        id="videoPizza"
        src="./assets/video/videopizza.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- TARGET 0 = OLIO -->

    <a-entity
      id="target0"
      mindar-image-target="targetIndex: 0"
    >
      <a-entity class="smoothWrapper">

        <a-plane
          class="videoPlane"
          position="0 0 0"
          width="1"
          height="1.45"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>

      </a-entity>
    </a-entity>

    <!-- TARGET 1 = PIZZA -->

    <a-entity
      id="target1"
      mindar-image-target="targetIndex: 1"
    >
      <a-entity class="smoothWrapper">

        <a-plane
          class="videoPlane"
          position="0 0 0"
          width="1"
          height="1.45"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>

      </a-entity>
    </a-entity>

    <!-- TARGET 2 = PIZZA -->

    <a-entity
      id="target2"
      mindar-image-target="targetIndex: 2"
    >
      <a-entity class="smoothWrapper">

        <a-plane
          class="videoPlane"
          position="0 0 0"
          width="1"
          height="1.45"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>

      </a-entity>
    </a-entity>

    <!-- TARGET 3 = PIZZA -->

    <a-entity
      id="target3"
      mindar-image-target="targetIndex: 3"
    >
      <a-entity class="smoothWrapper">

        <a-plane
          class="videoPlane"
          position="0 0 0"
          width="1"
          height="1.45"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>

      </a-entity>
    </a-entity>

  </a-scene>

  <script>

    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const debugBox = document.getElementById("debugBox");
    const scanText = document.getElementById("scanText");

    const sceneEl = document.getElementById("arScene");

    const videoOlio = document.getElementById("videoOlio");
    const videoPizza = document.getElementById("videoPizza");

    const targets = [
      document.getElementById("target0"),
      document.getElementById("target1"),
      document.getElementById("target2"),
      document.getElementById("target3")
    ];

    let activeVideo = null;
    let activePlane = null;
    let targetVisible = false;
    let videoFinished = false;

    function setDebug(text) {
      debugBox.textContent = "Stato: " + text;
      console.log(text);
    }

    function showHint(text = "Inquadra bene il prodotto") {
      scanText.textContent = text;
      scanText.style.display = "block";
    }

    function hideHint() {
      scanText.style.display = "none";
    }

    function stopAllVideos() {

      videoOlio.pause();
      videoPizza.pause();

      videoOlio.currentTime = 0;
      videoPizza.currentTime = 0;
    }

    function hideAllPlanes() {

      document.querySelectorAll(".videoPlane").forEach(plane => {

        plane.setAttribute("visible", false);
        plane.object3D.visible = false;
      });
    }

    async function unlockAudio(video) {

      try {

        video.muted = false;
        video.volume = 1;
        video.currentTime = 0;

        await video.play();

        video.pause();
        video.currentTime = 0;

      } catch (e) {

        console.warn("unlock audio:", e);
      }
    }

    async function playVideo(video, plane) {

      stopAllVideos();
      hideAllPlanes();

      activeVideo = video;
      activePlane = plane;

      plane.setAttribute("src", "#" + video.id);

      plane.setAttribute("visible", true);
      plane.object3D.visible = true;

      video.currentTime = 0;
      video.muted = false;
      video.volume = 1;

      try {

        await video.play();

      } catch (e) {

        console.warn(e);

        setDebug("tocca schermo per audio");

        document.body.addEventListener("click", async () => {

          try {

            await video.play();

          } catch (err) {

            console.warn(err);
          }

        }, { once: true });
      }

      video.onended = () => {

        video.pause();
        video.currentTime = 0;

        plane.setAttribute("visible", false);

        videoFinished = true;

        showHint(
          "Video terminato. Riinquadra il target."
        );

        setDebug("video terminato");
      };
    }

    async function startAR() {

      try {

        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        await unlockAudio(videoOlio);
        await unlockAudio(videoPizza);

        const startMindAR = async () => {

          const system = sceneEl.systems["mindar-image-system"];

          await system.start();

          startScreen.style.display = "none";

          showHint();

          setDebug("AR avviata");
        };

        if (sceneEl.hasLoaded) {

          await startMindAR();

        } else {

          sceneEl.addEventListener(
            "loaded",
            startMindAR,
            { once: true }
          );
        }

      } catch (err) {

        console.error(err);

        alert(
          "Permessi fotocamera/audio negati."
        );

        setDebug("errore permessi");
      }
    }

    startButton.addEventListener("click", startAR);

    function setupTarget(targetEl, video) {

      const wrapper =
        targetEl.querySelector(".smoothWrapper");

      const plane =
        targetEl.querySelector(".videoPlane");

      const smoothed = {
        position: new THREE.Vector3(),
        quaternion: new THREE.Quaternion(),
        scale: new THREE.Vector3(1,1,1)
      };

      let smoothingInitialized = false;

      targetEl.addEventListener("targetFound", async () => {

        targetVisible = true;
        videoFinished = false;

        hideHint();

        const targetObj = targetEl.object3D;
        const wrapperObj = wrapper.object3D;

        smoothed.position.copy(targetObj.position);
        smoothed.quaternion.copy(targetObj.quaternion);
        smoothed.scale.copy(targetObj.scale);

        wrapperObj.position.copy(smoothed.position);
        wrapperObj.quaternion.copy(smoothed.quaternion);
        wrapperObj.scale.copy(smoothed.scale);

        smoothingInitialized = true;

        await playVideo(video, plane);

        setDebug("target trovato");
      });

      targetEl.addEventListener("targetLost", () => {

        targetVisible = false;

        hideAllPlanes();

        stopAllVideos();

        showHint("Target perso. Riinquadra.");

        setDebug("target perso");

        smoothingInitialized = false;
      });

      sceneEl.addEventListener("renderstart", () => {

        const renderer = sceneEl.renderer;

        renderer.setAnimationLoop(() => {

          renderer.render(
            sceneEl.object3D,
            sceneEl.camera
          );

          if (
            !targetVisible ||
            !smoothingInitialized
          ) return;

          const targetObj = targetEl.object3D;
          const wrapperObj = wrapper.object3D;

          smoothed.position.lerp(
            targetObj.position,
            0.12
          );

          smoothed.quaternion.slerp(
            targetObj.quaternion,
            0.10
          );

          smoothed.scale.lerp(
            targetObj.scale,
            0.12
          );

          wrapperObj.position.copy(
            smoothed.position
          );

          wrapperObj.quaternion.copy(
            smoothed.quaternion
          );

          wrapperObj.scale.copy(
            smoothed.scale
          );
        });
      });
    }

    // TARGET 0 = OLIO

    setupTarget(
      document.getElementById("target0"),
      videoOlio
    );

    // TARGET 1 = PIZZA

    setupTarget(
      document.getElementById("target1"),
      videoPizza
    );

    // TARGET 2 = PIZZA

    setupTarget(
      document.getElementById("target2"),
      videoPizza
    );

    // TARGET 3 = PIZZA

    setupTarget(
      document.getElementById("target3"),
      videoPizza
    );

    sceneEl.addEventListener("arReady", () => {
      setDebug("MindAR pronto");
    });

    sceneEl.addEventListener("arError", () => {
      setDebug("errore MindAR");
    });

  </script>

</body>
</html>
