<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cirio - mARasense</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
      background: transparent !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
    }

    body > video:not(.contentVideo) {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      background: transparent !important;
      transform: scale(1.02);
      transform-origin: center center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      padding: 18px;
      background: radial-gradient(circle at center, rgba(20,20,20,.96) 0%, rgba(0,0,0,.96) 75%);
    }

    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,.92);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      color: #c62828;
    }

    .sub {
      font-size: 14px;
      margin-top: 10px;
      color: #222;
      line-height: 1.45;
    }

    .btn {
      margin-top: 15px;
      border: none;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(90deg, #c62828, #ff9800);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,.20);
    }

    .scan-layer {
      position: fixed;
      inset: 0;
      z-index: 18;
      pointer-events: none;
      display: none;
      background: transparent;
    }

    .scan-box {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(72vw, 340px);
      height: min(58vh, 460px);
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,.92);
      border-radius: 24px;
      box-shadow: 0 0 22px rgba(255,255,255,.18), inset 0 0 18px rgba(255,255,255,.10);
      overflow: hidden;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, #ffffff, #ff9800, #ffffff, transparent);
      box-shadow: 0 0 18px rgba(255,255,255,.75);
      animation: scanMove 1.6s ease-in-out infinite;
    }

    @keyframes scanMove {
      0% { top: 6%; }
      50% { top: 92%; }
      100% { top: 6%; }
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      z-index: 19;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,.52);
      padding: 10px 14px;
      border-radius: 12px;
      white-space: nowrap;
      display: none;
      backdrop-filter: blur(4px);
    }

    .video-layer {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
    }

    .video-wrap {
      width: min(86vw, 430px);
      aspect-ratio: 9 / 16;
      opacity: 0;
      transform: scale(0.82);
      transition: all 0.32s ease;
      pointer-events: none;
    }

    .video-wrap.show {
      opacity: 1;
      transform: scale(1);
    }

    .contentVideo {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: contain;
      background: transparent;
      display: none;
    }

    .contentVideo.active {
      display: block;
    }
  </style>
</head>

<body>

  <div class="overlay" id="ui">
    <div class="card">
      <div class="title">Cirio AR</div>
      <div class="sub">
        Premi Avvia esperienza e inquadra olio o pizza. Il video resta fermo fino alla fine.
      </div>
      <button class="btn" id="startBtn">Avvia esperienza</button>
    </div>
  </div>

  <div class="scan-layer" id="scanLayer">
    <div class="scan-box">
      <div class="scan-line"></div>
    </div>
  </div>

  <div class="hint" id="hint">Inquadra bene il prodotto</div>

  <div class="video-layer" id="videoLayer">
    <div class="video-wrap" id="videoWrap">
      <video
        id="videoOlio"
        class="contentVideo"
        src="./assets/video/videoolio.mp4"
        playsinline
        webkit-playsinline
        preload="auto"
        muted
      ></video>

      <video
        id="videoPizza"
        class="contentVideo"
        src="./assets/video/videopizza.mp4"
        playsinline
        webkit-playsinline
        preload="auto"
        muted
      ></video>
    </div>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart:false; uiLoading:no; uiScanning:no; uiError:no;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; colorManagement:true;"
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="t0" mindar-image-target="targetIndex:0"></a-entity>
    <a-entity id="t1" mindar-image-target="targetIndex:1"></a-entity>
    <a-entity id="t2" mindar-image-target="targetIndex:2"></a-entity>
    <a-entity id="t3" mindar-image-target="targetIndex:3"></a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById("startBtn");
    const ui = document.getElementById("ui");
    const hint = document.getElementById("hint");
    const scanLayer = document.getElementById("scanLayer");

    const scene = document.getElementById("scene");

    const videoLayer = document.getElementById("videoLayer");
    const videoWrap = document.getElementById("videoWrap");

    const videoOlio = document.getElementById("videoOlio");
    const videoPizza = document.getElementById("videoPizza");

    const t0 = document.getElementById("t0");
    const t1 = document.getElementById("t1");
    const t2 = document.getElementById("t2");
    const t3 = document.getElementById("t3");

    let playing = false;
    let currentVideo = null;

    async function unlockVideo(video) {
      try {
        video.muted = true;
        video.currentTime = 0;
        await video.play();
        video.pause();
        video.currentTime = 0;
      } catch (e) {
        console.log("unlock warning", e);
      }
    }

    async function unlockMedia() {
      await unlockVideo(videoOlio);
      await unlockVideo(videoPizza);
    }

    function showScanner() {
      hint.style.display = "block";
      scanLayer.style.display = "block";
    }

    function hideScanner() {
      hint.style.display = "none";
      scanLayer.style.display = "none";
    }

    function showVideo(video) {
      hideScanner();

      videoOlio.classList.remove("active");
      videoPizza.classList.remove("active");

      video.classList.add("active");

      videoLayer.style.display = "flex";

      requestAnimationFrame(() => {
        videoWrap.classList.add("show");
      });
    }

    function hideVideo() {
      videoWrap.classList.remove("show");

      setTimeout(() => {
        videoLayer.style.display = "none";
        videoOlio.classList.remove("active");
        videoPizza.classList.remove("active");
      }, 220);
    }

    async function playExperience(video) {
      if (playing) return;

      playing = true;
      currentVideo = video;

      videoOlio.pause();
      videoPizza.pause();

      videoOlio.currentTime = 0;
      videoPizza.currentTime = 0;

      video.muted = false;
      video.volume = 1;
      video.currentTime = 0;

      showVideo(video);

      try {
        await video.play();
      } catch (e) {
        console.log("play error", e);

        document.body.addEventListener("click", async () => {
          try {
            video.muted = false;
            video.volume = 1;
            video.currentTime = 0;
            await video.play();
          } catch (err) {
            console.log("play after tap error", err);
          }
        }, { once: true });
      }
    }

    function resetExperience() {
      playing = false;

      if (currentVideo) {
        currentVideo.pause();
        currentVideo.currentTime = 0;
      }

      currentVideo = null;

      hideVideo();
      showScanner();
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Avvio...";

      await unlockMedia();

      const startAR = async () => {
        await scene.systems["mindar-image-system"].start();
        ui.style.display = "none";
        showScanner();
      };

      if (scene.hasLoaded) {
        startAR();
      } else {
        scene.addEventListener("loaded", startAR, { once: true });
      }
    };

    t0.addEventListener("targetFound", () => {
      playExperience(videoOlio);
    });

    t1.addEventListener("targetFound", () => {
      playExperience(videoPizza);
    });

    t2.addEventListener("targetFound", () => {
      playExperience(videoPizza);
    });

    t3.addEventListener("targetFound", () => {
      playExperience(videoPizza);
    });

    videoOlio.addEventListener("ended", resetExperience);
    videoPizza.addEventListener("ended", resetExperience);

    t0.addEventListener("targetLost", () => {});
    t1.addEventListener("targetLost", () => {});
    t2.addEventListener("targetLost", () => {});
    t3.addEventListener("targetLost", () => {});
  </script>

</body>
</html>
