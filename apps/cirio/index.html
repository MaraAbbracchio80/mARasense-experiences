<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Cirio - mARasense</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, sans-serif;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111 0%, #000 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startButton {
      background: #8A2BE2;
      border: none;
      color: white;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    #debug {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      backdrop-filter: blur(4px);
    }

    /* LENS */

    #lens {
      position: fixed;
      inset: 0;
      z-index: 9998;
      pointer-events: none;
      display: none;
    }

    #lens::before {

      content: "";

      position: absolute;

      width: 260px;
      height: 260px;

      border: 4px solid rgba(255,255,255,0.92);
      border-radius: 24px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.08),
        0 0 30px rgba(255,255,255,0.25);

      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {

      0% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.03);
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
      }
    }

    #scanText {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
    }

    video,
    canvas,
    .a-canvas {

      position: fixed !important;
      inset: 0 !important;

      width: 100vw !important;
      height: 100vh !important;

      object-fit: cover !important;

      background: transparent !important;
    }

    canvas,
    .a-canvas {
      z-index: 2 !important;
    }

  </style>
</head>

<body>

  <div id="startScreen">

    <h1>Cirio</h1>

    <p>
      Premi Avvia esperienza e inquadra il prodotto.
    </p>

    <button id="startButton">
      Avvia esperienza
    </button>

  </div>

  <div id="debug">
    Stato: attesa
  </div>

  <div id="lens"></div>

  <div id="scanText">
    Inquadra il prodotto
  </div>

  <a-scene

    id="scene"

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    loading-screen="enabled: false"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
      alpha: true;
    "

    color-space="sRGB"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      uiScanning: no;
      uiLoading: no;
      uiError: no;
      autoStart: false;
    "
  >

    <a-assets>

      <video
        id="videoOlio"
        src="./assets/video/videoolio.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

      <video
        id="videoPizza"
        src="./assets/video/videopizza.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- TARGET 0 -->

    <a-entity
      id="target0"
      mindar-image-target="targetIndex: 0"
    >

      <a-plane
        id="videoPlane"
        position="0 0 0"
        width="1"
        height="1.45"
        visible="false"
        material="
          shader: flat;
          transparent: true;
          opacity: 1;
        "
      ></a-plane>

    </a-entity>

    <!-- TARGET 1 -->

    <a-entity
      id="target1"
      mindar-image-target="targetIndex: 1"
    ></a-entity>

    <!-- TARGET 2 -->

    <a-entity
      id="target2"
      mindar-image-target="targetIndex: 2"
    ></a-entity>

    <!-- TARGET 3 -->

    <a-entity
      id="target3"
      mindar-image-target="targetIndex: 3"
    ></a-entity>

  </a-scene>

  <script>

    const startButton = document.getElementById("startButton");
    const startScreen = document.getElementById("startScreen");

    const debug = document.getElementById("debug");

    const lens = document.getElementById("lens");

    const scanText = document.getElementById("scanText");

    const scene = document.getElementById("scene");

    const videoPlane = document.getElementById("videoPlane");

    const videoOlio = document.getElementById("videoOlio");
    const videoPizza = document.getElementById("videoPizza");

    const target0 = document.getElementById("target0");
    const target1 = document.getElementById("target1");
    const target2 = document.getElementById("target2");
    const target3 = document.getElementById("target3");

    let currentVideo = null;

    function setDebug(text) {

      debug.innerHTML = "Stato: " + text;

      console.log(text);
    }

    function showLens() {

      lens.style.display = "block";

      scanText.style.display = "block";
    }

    function hideLens() {

      lens.style.display = "none";

      scanText.style.display = "none";
    }

    function stopAllVideos() {

      [videoOlio, videoPizza].forEach(v => {

        v.pause();

        v.currentTime = 0;
      });
    }

    async function unlockVideo(video) {

      try {

        video.muted = false;

        video.volume = 1;

        await video.play();

        video.pause();

        video.currentTime = 0;

      } catch(e) {

        console.warn(e);
      }
    }

    async function playVideo(video) {

      stopAllVideos();

      currentVideo = video;

      videoPlane.setAttribute(
        "src",
        "#" + video.id
      );

      videoPlane.setAttribute(
        "visible",
        true
      );

      try {

        video.muted = false;

        video.volume = 1;

        await video.play();

      } catch(err) {

        console.warn(err);
      }

      video.onended = () => {

        video.pause();

        video.currentTime = 0;

        videoPlane.setAttribute(
          "visible",
          false
        );

        showLens();

        setDebug("video terminato");
      };
    }

    async function startAR() {

      try {

        await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        await unlockVideo(videoOlio);
        await unlockVideo(videoPizza);

        const system =
          scene.systems["mindar-image-system"];

        await system.start();

        startScreen.style.display = "none";

        showLens();

        setDebug("AR avviata");

      } catch(err) {

        console.error(err);

        alert(
          "Permessi fotocamera/audio negati."
        );
      }
    }

    startButton.addEventListener(
      "click",
      startAR
    );

    function setupTarget(target, video) {

      target.addEventListener(
        "targetFound",
        async () => {

          hideLens();

          setDebug("target trovato");

          await playVideo(video);
        }
      );

      target.addEventListener(
        "targetLost",
        () => {

          stopAllVideos();

          videoPlane.setAttribute(
            "visible",
            false
          );

          showLens();

          setDebug("target perso");
        }
      );
    }

    setupTarget(target0, videoOlio);

    setupTarget(target1, videoPizza);

    setupTarget(target2, videoPizza);

    setupTarget(target3, videoPizza);

    scene.addEventListener("arReady", () => {

      setDebug("MindAR pronto");
    });

    scene.addEventListener("arError", () => {

      setDebug("errore MindAR");
    });

  </script>

</body>
</html>
