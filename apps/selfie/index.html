<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selfie con il giocatore - mARasense</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    #video, #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #canvas { display: none; }

    #player {
  position: fixed;
  right: -34%;
  top: 4%;
  width: 128vw;
  max-width: 880px;
  min-width: 520px;
  z-index: 2;
  opacity: 0.94;
  pointer-events: none;
  transform: none;
  filter: drop-shadow(0 0 18px rgba(29,216,255,0.25));
}

    .topbar {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .badge, .back {
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(0,0,0,0.58);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      text-decoration: none;
    }

    .frame-title {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 104px;
      z-index: 8;
      text-align: center;
      font-size: 25px;
      font-weight: 900;
      text-shadow: 0 3px 14px #000;
      pointer-events: none;
    }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 12;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 14px;
    }

    button, a.btn {
      border: none;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 900;
      color: white;
      text-decoration: none;
      background: linear-gradient(90deg, #1fd7ff, #78b8ff);
      box-shadow: 0 8px 22px rgba(0,0,0,0.38);
      cursor: pointer;
    }

    .secondary {
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.24);
    }

    #result {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      gap: 14px;
    }

    #photo {
      max-width: 94vw;
      max-height: 74vh;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 0 24px rgba(29,216,255,0.20);
    }

    .result-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>

<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div class="topbar">
    <div class="badge">Selfie AR</div>
    <a class="back" href="../../index.html">← Demo</a>
  </div>

  <img id="player" src="../shared/img/selfie-player.png" alt="Giocatore" />

  <div class="frame-title">
    Io e Di Lorenzo
  </div>

  <div class="controls">
    <button onclick="takePhoto()">Scatta</button>
  </div>

  <div id="result">
    <img id="photo" alt="Selfie scattato" />
    <div class="result-actions">
      <a id="downloadBtn" class="btn" download="io-e-di-lorenzo.png">Salva foto</a>
      <button class="secondary" onclick="closeResult()">Rifai</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const player = document.getElementById("player");
    const result = document.getElementById("result");
    const photo = document.getElementById("photo");
    const downloadBtn = document.getElementById("downloadBtn");

    let currentFace = null;

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;

        video.onloadedmetadata = () => {
          video.play();
          startFaceDetection();
        };
      } catch (err) {
        console.error(err);
        alert("Camera non disponibile. Controlla i permessi del browser.");
      }
    }

    function startFaceDetection() {
      const faceDetection = new FaceDetection({
        locateFile: (file) => {
          return "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/" + file;
        }
      });

      faceDetection.setOptions({
        model: "short",
        minDetectionConfidence: 0.55
      });

      faceDetection.onResults((results) => {
        if (!results.detections || results.detections.length === 0) return;

        const detection = results.detections[0];
        const box = detection.boundingBox;

        currentFace = box;
        positionPlayerFromFace(box);
      });

      const camera = new Camera(video, {
        onFrame: async () => {
          await faceDetection.send({ image: video });
        },
        width: 720,
        height: 1280
      });

      camera.start();
    }

    function positionPlayerFromFace(faceBox) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const faceX = faceBox.xCenter * vw;
      const faceY = faceBox.yCenter * vh;
      const faceW = faceBox.width * vw;
      const faceH = faceBox.height * vh;

      const playerHeight = faceH * 4.2;
      const playerWidth = playerHeight * 0.72;

      let playerLeft = faceX + faceW * 0.38;
      let playerTop = faceY - faceH * 1.35;

      player.style.width = playerWidth + "px";
      player.style.left = playerLeft + "px";
      player.style.top = playerTop + "px";
      player.style.right = "auto";
      player.style.bottom = "auto";
    }

    function drawCover(ctx, media, x, y, w, h) {
      const mediaW = media.videoWidth || media.naturalWidth || w;
      const mediaH = media.videoHeight || media.naturalHeight || h;
      const mediaRatio = mediaW / mediaH;
      const boxRatio = w / h;

      let drawW = w;
      let drawH = h;
      let offsetX = 0;
      let offsetY = 0;

      if (mediaRatio > boxRatio) {
        drawH = h;
        drawW = h * mediaRatio;
        offsetX = (w - drawW) / 2;
      } else {
        drawW = w;
        drawH = w / mediaRatio;
        offsetY = (h - drawH) / 2;
      }

      ctx.drawImage(media, x + offsetX, y + offsetY, drawW, drawH);
    }

    function takePhoto() {
      const aspect = img.naturalWidth / img.naturalHeight;

const drawHeight = h * 0.86;
const drawWidth = drawHeight * aspect;

const drawX = w * 0.52;
const drawY = h * 0.03;

ctx.drawImage(img, drawX, drawY, drawWidth, drawHeight);

      drawCover(ctx, video, 0, 0, w, h);

      const img = new Image();
      img.crossOrigin = "anonymous";
      img.src = player.src;

      img.onload = function () {
        let drawX, drawY, drawW, drawH;

        if (currentFace) {
          const faceX = currentFace.xCenter * w;
          const faceY = currentFace.yCenter * h;
          const faceW = currentFace.width * w;
          const faceH = currentFace.height * h;

          drawH = faceH * 4.2;
          drawW = drawH * (img.naturalWidth / img.naturalHeight);

          drawX = faceX + faceW * 0.42;
          drawY = faceY - faceH * 1.35;
        } else {
          drawH = h * 0.72;
          drawW = drawH * (img.naturalWidth / img.naturalHeight);
          drawX = w * 0.56;
          drawY = h * 0.12;
        }

        ctx.drawImage(img, drawX, drawY, drawW, drawH);

        ctx.strokeStyle = "#1fd7ff";
        ctx.lineWidth = Math.max(8, w * 0.012);
        ctx.strokeRect(18, 18, w - 36, h - 36);

        ctx.fillStyle = "rgba(0,0,0,0.58)";
        ctx.fillRect(0, h - 132, w, 132);

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "bold " + Math.round(w * 0.064) + "px Arial";
        ctx.fillText("Io e Di Lorenzo", w / 2, h - 74);

        ctx.font = "bold " + Math.round(w * 0.034) + "px Arial";
        ctx.fillText("mARasense experiences", w / 2, h - 35);

        const dataUrl = canvas.toDataURL("image/png");
        photo.src = dataUrl;
        downloadBtn.href = dataUrl;
        result.style.display = "flex";
      };

      img.onerror = function () {
        alert("Immagine giocatore non trovata. Controlla apps/shared/img/selfie-player.png");
      };
    }

    function closeResult() {
      result.style.display = "none";
    }

    startCamera();
  </script>
</body>
</html>
