<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vini - mARasense</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #102015 0%, #000 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      margin: 0 0 12px 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }

    #startScreen p {
      margin: 0 0 20px 0;
      font-size: 15px;
      max-width: 340px;
      line-height: 1.5;
      color: #ddd;
    }

    #startButton {
      background: linear-gradient(90deg, #1f7a3a, #d6b45a);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(214,180,90,0.35);
    }

    #debugBox {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.68);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 92vw;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #scanText {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      z-index: 9998;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.60);
      padding: 10px 14px;
      border-radius: 10px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      z-index: 10;
      background: transparent !important;
    }

    video,
    canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      background: transparent !important;
    }

    video {
      z-index: 1 !important;
      transform: scale(1.02);
      transform-origin: center center;
    }

    canvas,
    .a-canvas {
      z-index: 2 !important;
    }
  </style>
</head>

<body>
  <div id="startScreen">
    <h1>Vini</h1>
    <p>Premi Avvia esperienza e inquadra la bottiglia. Quando uno dei target viene riconosciuto, partiranno video e audio.</p>
    <button id="startButton">Avvia esperienza</button>
  </div>

  <div id="debugBox">Stato: attesa avvio</div>
  <div id="scanText">Inquadra bene la bottiglia</div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    color-space="sRGB"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no; uiError: no; autoStart: false;"
  >
    <a-assets>
      <video
        id="experienceVideo"
        src="./assets/videos/vino.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

      <audio
        id="experienceAudio"
        src="./assets/audio/vino.mp3"
        preload="auto"
        crossorigin="anonymous"
      ></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target invisibili: servono solo per riconoscere la bottiglia -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="target2" mindar-image-target="targetIndex: 2"></a-entity>

    <!-- Piano bloccato: resta fermo anche se perdi il target -->
    <a-entity id="lockedAnchor" visible="false">
      <a-plane
        id="lockedVideoPlane"
        src="#experienceVideo"
        position="0 0 0"
        width="1.00"
        height="1.45"
        material="shader: flat; transparent: true; opacity: 1"
      ></a-plane>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const debugBox = document.getElementById("debugBox");
    const scanText = document.getElementById("scanText");
    const sceneEl = document.getElementById("arScene");

    const video = document.getElementById("experienceVideo");
    const audio = document.getElementById("experienceAudio");

    const lockedAnchor = document.getElementById("lockedAnchor");

    const targets = [
      document.getElementById("target0"),
      document.getElementById("target1"),
      document.getElementById("target2")
    ];

    let playing = false;
    let videoEnded = false;
    let audioEnded = false;

    function setDebug(text) {
      debugBox.textContent = "Stato: " + text;
      console.log(text);
    }

    function showHint(text) {
      scanText.textContent = text || "Inquadra bene la bottiglia";
      scanText.style.display = "block";
    }

    function hideHint() {
      scanText.style.display = "none";
    }

    function showLockedPlane() {
      lockedAnchor.setAttribute("visible", true);
      lockedAnchor.object3D.visible = true;
    }

    function hideLockedPlane() {
      lockedAnchor.setAttribute("visible", false);
      lockedAnchor.object3D.visible = false;
    }

    function lockPlaneOnTarget(targetEl) {
      const targetObj = targetEl.object3D;
      const anchorObj = lockedAnchor.object3D;

      anchorObj.position.copy(targetObj.position);
      anchorObj.quaternion.copy(targetObj.quaternion);
      anchorObj.scale.copy(targetObj.scale);

      showLockedPlane();
    }

    async function unlockMedia() {
      try {
        video.muted = true;
        video.currentTime = 0;
        await video.play();
        video.pause();
        video.currentTime = 0;

        audio.volume = 1;
        audio.currentTime = 0;
        await audio.play();
        audio.pause();
        audio.currentTime = 0;

        setDebug("audio/video sbloccati");
      } catch (e) {
        console.warn("Sblocco media non completo:", e);
      }
    }

    async function playMediaFromStart() {
      try {
        video.pause();
        audio.pause();

        video.currentTime = 0;
        audio.currentTime = 0;

        videoEnded = false;
        audioEnded = false;

        video.muted = true;
        audio.volume = 1;

        await Promise.all([
          video.play(),
          audio.play()
        ]);

        setDebug("target trovato: esperienza bloccata e avviata");
      } catch (e) {
        console.warn("Errore avvio media:", e);
        setDebug("tocca lo schermo per attivare audio");

        document.body.addEventListener("click", async () => {
          try {
            video.currentTime = 0;
            audio.currentTime = 0;

            video.muted = true;
            audio.volume = 1;

            await Promise.all([
              video.play(),
              audio.play()
            ]);

            setDebug("audio/video attivati");
          } catch (err) {
            console.warn("Errore dopo click:", err);
          }
        }, { once: true });
      }
    }

    async function startExperience(targetEl) {
      if (playing) return;

      playing = true;
      hideHint();

      lockPlaneOnTarget(targetEl);
      await playMediaFromStart();
    }

    function finishIfBothEnded() {
      if (!videoEnded || !audioEnded) return;

      playing = false;

      video.pause();
      audio.pause();

      video.currentTime = 0;
      audio.currentTime = 0;

      hideLockedPlane();

      showHint("Esperienza conclusa. Riinquadra la bottiglia per ripartire.");
      setDebug("esperienza conclusa");
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Avvio...";

      await unlockMedia();

      const startAR = async () => {
        const mindarSystem = sceneEl.systems["mindar-image-system"];

        if (!mindarSystem) {
          setDebug("mindar-image-system non trovato");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
          return;
        }

        try {
          await mindarSystem.start();
          startScreen.style.display = "none";
          hideLockedPlane();
          showHint("Inquadra bene la bottiglia");
          setDebug("AR avviata. Ricerca bottiglia...");
        } catch (err) {
          console.error(err);
          setDebug("errore avvio AR");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
        }
      };

      if (sceneEl.hasLoaded) {
        startAR();
      } else {
        sceneEl.addEventListener("loaded", startAR, { once: true });
      }
    });

    sceneEl.addEventListener("arReady", () => {
      setDebug("MindAR pronto");
    });

    sceneEl.addEventListener("arError", () => {
      setDebug("errore MindAR");
    });

    targets.forEach((target) => {
      target.addEventListener("targetFound", () => {
        startExperience(target);
      });

      target.addEventListener("targetLost", () => {
        if (playing) {
          setDebug("target perso, ma esperienza continua fino alla fine");
          return;
        }

        showHint("Target perso. Riinquadra la bottiglia.");
      });
    });

    video.addEventListener("ended", () => {
      videoEnded = true;
      finishIfBothEnded();
    });

    audio.addEventListener("ended", () => {
      audioEnded = true;
      finishIfBothEnded();
    });

    setInterval(() => {
      if (!playing && startScreen.style.display === "none") {
        showHint("Inquadra bene la bottiglia");
      }
    }, 900);
  </script>
</body>
</html>
