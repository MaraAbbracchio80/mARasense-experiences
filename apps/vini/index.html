<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vini - mARasense</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #000;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
      background: transparent !important;
    }

    canvas.a-canvas {
      width: 100vw !important;
      height: 100vh !important;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 18px;
      background: radial-gradient(circle at center, #102015 0%, #000 75%);
    }

    .card {
      width: min(560px, 100%);
      background: rgba(255,255,255,.92);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      color: #1f7a3a;
    }

    .sub {
      font-size: 14px;
      margin-top: 10px;
      color: #19351f;
      line-height: 1.45;
    }

    .btn {
      margin-top: 15px;
      border: none;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(90deg, #1f7a3a, #d6b45a);
      color: white;
      box-shadow: 0 8px 22px rgba(0,0,0,.20);
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      z-index: 15;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,.60);
      padding: 10px 14px;
      border-radius: 12px;
      white-space: nowrap;
      display: none;
      backdrop-filter: blur(4px);
    }

    .video-layer {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      align-items: center;
      justify-content: center;
      background: transparent;
      pointer-events: none;
    }

    .video-wrap {
      width: min(86vw, 430px);
      aspect-ratio: 9 / 16;
      opacity: 0;
      transform: scale(0.78);
      transition: all 0.35s ease;
      pointer-events: none;
    }

    .video-wrap.show {
      opacity: 1;
      transform: scale(1);
    }

    #playerVideo {
      width: 100%;
      height: 100%;
      border-radius: 18px;
      object-fit: contain;
      background: transparent;
      display: block;
    }
  </style>
</head>

<body>

  <div class="overlay" id="ui">
    <div class="card">
      <div class="title">Vini AR</div>
      <div class="sub">
        Premi Avvia esperienza e inquadra la bottiglia. Quando viene riconosciuta, partiranno video e audio insieme.
      </div>
      <button class="btn" id="startBtn">Avvia esperienza</button>
    </div>
  </div>

  <div class="hint" id="hint">Inquadra bene la bottiglia</div>

  <div class="video-layer" id="videoLayer">
    <div class="video-wrap" id="videoWrap">
      <video
        id="playerVideo"
        src="./assets/videos/vino.mp4"
        playsinline
        webkit-playsinline
        preload="auto"
        muted
      ></video>
    </div>
  </div>

  <audio id="playerAudio" src="./assets/audio/vino.mp3" preload="auto"></audio>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart:false; uiLoading:no; uiScanning:no; uiError:no;"
    embedded
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="alpha:true; colorManagement:true;"
  >
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="t0" mindar-image-target="targetIndex:0"></a-entity>
    <a-entity id="t1" mindar-image-target="targetIndex:1"></a-entity>
    <a-entity id="t2" mindar-image-target="targetIndex:2"></a-entity>
  </a-scene>

  <script>
    const startBtn = document.getElementById("startBtn");
    const ui = document.getElementById("ui");
    const hint = document.getElementById("hint");

    const scene = document.getElementById("scene");

    const videoLayer = document.getElementById("videoLayer");
    const videoWrap = document.getElementById("videoWrap");
    const playerVideo = document.getElementById("playerVideo");
    const playerAudio = document.getElementById("playerAudio");

    const t0 = document.getElementById("t0");
    const t1 = document.getElementById("t1");
    const t2 = document.getElementById("t2");

    let playing = false;

    async function unlockMedia() {
      try {
        playerVideo.muted = true;
        playerVideo.currentTime = 0;
        await playerVideo.play();
        playerVideo.pause();
        playerVideo.currentTime = 0;

        playerAudio.volume = 1;
        playerAudio.currentTime = 0;
        await playerAudio.play();
        playerAudio.pause();
        playerAudio.currentTime = 0;
      } catch (e) {
        console.log("unlock media warning", e);
      }
    }

    function showVideo() {
      hint.style.display = "none";
      videoLayer.style.display = "flex";
      requestAnimationFrame(() => {
        videoWrap.classList.add("show");
      });
    }

    function hideVideo() {
      videoWrap.classList.remove("show");

      setTimeout(() => {
        videoLayer.style.display = "none";
      }, 220);
    }

    async function playExperience() {
      if (playing) return;

      playing = true;

      playerVideo.pause();
      playerAudio.pause();

      playerVideo.currentTime = 0;
      playerAudio.currentTime = 0;

      playerVideo.muted = true;
      playerAudio.volume = 1;

      showVideo();

      try {
        await Promise.all([
          playerVideo.play(),
          playerAudio.play()
        ]);
      } catch (e) {
        console.log("play error", e);

        document.body.addEventListener("click", async () => {
          try {
            playerVideo.currentTime = 0;
            playerAudio.currentTime = 0;

            await Promise.all([
              playerVideo.play(),
              playerAudio.play()
            ]);
          } catch (err) {
            console.log("play after tap error", err);
          }
        }, { once: true });
      }
    }

    function resetExperience() {
      playing = false;

      playerVideo.pause();
      playerAudio.pause();

      playerVideo.currentTime = 0;
      playerAudio.currentTime = 0;

      hideVideo();
      hint.style.display = "block";
    }

    startBtn.onclick = async () => {
      startBtn.disabled = true;
      startBtn.textContent = "Avvio...";

      await unlockMedia();

      const startAR = async () => {
        await scene.systems["mindar-image-system"].start();
        ui.style.display = "none";
        hint.style.display = "block";
      };

      if (scene.hasLoaded) {
        startAR();
      } else {
        scene.addEventListener("loaded", startAR, { once: true });
      }
    };

    t0.addEventListener("targetFound", playExperience);
    t1.addEventListener("targetFound", playExperience);
    t2.addEventListener("targetFound", playExperience);

    playerVideo.addEventListener("ended", () => {
      resetExperience();
    });

    playerAudio.addEventListener("ended", () => {
      playerAudio.pause();
    });
  </script>

</body>
</html>
