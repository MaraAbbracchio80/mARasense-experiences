<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vini - mARasense</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #102015 0%, #000 75%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      margin: 0 0 12px 0;
      font-size: 30px;
    }

    #startScreen p {
      margin: 0 0 20px 0;
      font-size: 15px;
      max-width: 340px;
      line-height: 1.5;
      color: #ddd;
    }

    #startButton {
      background: linear-gradient(90deg, #1f7a3a, #d6b45a);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(214, 180, 90, 0.35);
    }

    #debugBox {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.68);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 92vw;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #scanText {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      z-index: 9998;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.60);
      padding: 10px 14px;
      border-radius: 10px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      z-index: 10;
      background: transparent !important;
    }

    video,
    canvas,
    .a-canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      object-fit: cover !important;
      background: transparent !important;
    }

    video {
      z-index: 1 !important;
      transform: scale(1.04);
      transform-origin: center center;
    }

    canvas,
    .a-canvas {
      z-index: 2 !important;
    }
  </style>
</head>

<body>
  <div id="startScreen">
    <h1>Vini</h1>
    <p>Premi Avvia esperienza e inquadra la bottiglia. Quando uno dei target viene riconosciuto, partiranno video e audio insieme.</p>
    <button id="startButton">Avvia esperienza</button>
  </div>

  <div id="debugBox">Stato: attesa avvio</div>
  <div id="scanText">Inquadra bene la bottiglia</div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    color-space="sRGB"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no; uiError: no; autoStart: false;"
  >
    <a-assets>
      <video
        id="experienceVideo"
        src="./assets/videos/vino.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>

      <audio
        id="experienceAudio"
        src="./assets/audio/vino.mp3"
        preload="auto"
        crossorigin="anonymous"
      ></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="smoothWrapper0">
        <a-plane
          id="videoPlane0"
          src="#experienceVideo"
          position="0 0 0"
          width="1.00"
          height="1.45"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>
      </a-entity>
    </a-entity>

    <a-entity id="target1" mindar-image-target="targetIndex: 1">
      <a-entity id="smoothWrapper1">
        <a-plane
          id="videoPlane1"
          src="#experienceVideo"
          position="0 0 0"
          width="1.00"
          height="1.45"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>
      </a-entity>
    </a-entity>

    <a-entity id="target2" mindar-image-target="targetIndex: 2">
      <a-entity id="smoothWrapper2">
        <a-plane
          id="videoPlane2"
          src="#experienceVideo"
          position="0 0 0"
          width="1.00"
          height="1.45"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const debugBox = document.getElementById("debugBox");
    const scanText = document.getElementById("scanText");
    const sceneEl = document.getElementById("arScene");

    const video = document.getElementById("experienceVideo");
    const audio = document.getElementById("experienceAudio");

    const targets = [
      {
        target: document.getElementById("target0"),
        wrapper: document.getElementById("smoothWrapper0"),
        plane: document.getElementById("videoPlane0")
      },
      {
        target: document.getElementById("target1"),
        wrapper: document.getElementById("smoothWrapper1"),
        plane: document.getElementById("videoPlane1")
      },
      {
        target: document.getElementById("target2"),
        wrapper: document.getElementById("smoothWrapper2"),
        plane: document.getElementById("videoPlane2")
      }
    ];

    let activeIndex = null;
    let locked = false;
    let videoFinished = false;

    const smoothed = targets.map(() => ({
      position: new THREE.Vector3(),
      quaternion: new THREE.Quaternion(),
      scale: new THREE.Vector3(1, 1, 1),
      initialized: false
    }));

    function setDebug(text) {
      debugBox.textContent = "Stato: " + text;
      console.log(text);
    }

    function showHint(text = "Inquadra bene la bottiglia") {
      scanText.textContent = text;
      scanText.style.display = "block";
    }

    function hideHint() {
      scanText.style.display = "none";
    }

    function showPlane(index) {
      targets.forEach((item, i) => {
        const visible = i === index;
        item.plane.setAttribute("visible", visible);
        item.plane.object3D.visible = visible;
      });
    }

    function hideAllPlanes() {
      targets.forEach((item) => {
        item.plane.setAttribute("visible", false);
        item.plane.object3D.visible = false;
      });
    }

    async function unlockMedia() {
      try {
        video.muted = true;
        video.currentTime = 0;
        await video.play();
        video.pause();
        video.currentTime = 0;

        audio.volume = 1;
        audio.currentTime = 0;
        await audio.play();
        audio.pause();
        audio.currentTime = 0;

        setDebug("audio/video sbloccati");
      } catch (e) {
        console.warn("Sblocco media non completo:", e);
      }
    }

    async function playFromStart() {
      try {
        video.pause();
        audio.pause();

        video.currentTime = 0;
        audio.currentTime = 0;

        video.muted = true;
        audio.volume = 1;

        const videoPromise = video.play();
        const audioPromise = audio.play();

        await Promise.all([videoPromise, audioPromise]);

        setDebug("video e audio avviati");
      } catch (e) {
        console.warn("Errore play media:", e);
        setDebug("tocca lo schermo per attivare audio");

        document.body.addEventListener("click", async () => {
          try {
            video.currentTime = 0;
            audio.currentTime = 0;

            video.muted = true;
            audio.volume = 1;

            await Promise.all([video.play(), audio.play()]);
            setDebug("audio/video attivati");
          } catch (err) {
            console.warn("Errore dopo click:", err);
          }
        }, { once: true });
      }
    }

    function initializeSmoothing(index) {
      const item = targets[index];
      const smooth = smoothed[index];

      smooth.position.copy(item.target.object3D.position);
      smooth.quaternion.copy(item.target.object3D.quaternion);
      smooth.scale.copy(item.target.object3D.scale);

      item.wrapper.object3D.position.copy(smooth.position);
      item.wrapper.object3D.quaternion.copy(smooth.quaternion);
      item.wrapper.object3D.scale.copy(smooth.scale);

      smooth.initialized = true;
    }

    async function lockOnTarget(index) {
      if (locked) return;

      locked = true;
      activeIndex = index;
      videoFinished = false;

      hideHint();
      initializeSmoothing(index);
      showPlane(index);

      setDebug("target trovato. Esperienza avviata.");
      await playFromStart();
    }

    function stopExperience(message = "Target perso. Riinquadra la bottiglia.") {
      locked = false;
      activeIndex = null;

      video.pause();
      audio.pause();
      video.currentTime = 0;
      audio.currentTime = 0;

      hideAllPlanes();
      showHint(message);
      setDebug("target perso");
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Avvio...";

      await unlockMedia();

      const startAR = async () => {
        const mindarSystem = sceneEl.systems["mindar-image-system"];

        if (!mindarSystem) {
          setDebug("mindar-image-system non trovato");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
          return;
        }

        try {
          await mindarSystem.start();
          startScreen.style.display = "none";
          showHint();
          hideAllPlanes();
          setDebug("AR avviata. Ricerca bottiglia...");
        } catch (err) {
          console.error(err);
          setDebug("errore avvio AR");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
        }
      };

      if (sceneEl.hasLoaded) {
        startAR();
      } else {
        sceneEl.addEventListener("loaded", startAR, { once: true });
      }
    });

    sceneEl.addEventListener("arReady", () => {
      setDebug("MindAR pronto");
    });

    sceneEl.addEventListener("arError", () => {
      setDebug("errore MindAR");
    });

    targets.forEach((item, index) => {
      item.target.addEventListener("targetFound", async () => {
        await lockOnTarget(index);
      });

      item.target.addEventListener("targetLost", () => {
        if (activeIndex === index && !videoFinished) {
          stopExperience();
        }
      });
    });

    video.addEventListener("ended", () => {
      video.pause();
      audio.pause();
      videoFinished = true;

      if (activeIndex !== null) {
        hideAllPlanes();
        showHint("Video finito. Riinquadra la bottiglia per ripartire.");
        setDebug("video terminato");
      }

      locked = false;
      activeIndex = null;
    });

    audio.addEventListener("ended", () => {
      audio.pause();
    });

    sceneEl.addEventListener("renderstart", () => {
      const renderer = sceneEl.renderer;

      renderer.setAnimationLoop(() => {
        renderer.render(sceneEl.object3D, sceneEl.camera);

        if (activeIndex === null) return;

        const item = targets[activeIndex];
        const smooth = smoothed[activeIndex];

        if (!smooth.initialized) return;

        const positionLerp = 0.12;
        const rotationLerp = 0.10;
        const scaleLerp = 0.12;

        smooth.position.lerp(item.target.object3D.position, positionLerp);
        smooth.quaternion.slerp(item.target.object3D.quaternion, rotationLerp);
        smooth.scale.lerp(item.target.object3D.scale, scaleLerp);

        item.wrapper.object3D.position.copy(smooth.position);
        item.wrapper.object3D.quaternion.copy(smooth.quaternion);
        item.wrapper.object3D.scale.copy(smooth.scale);
      });
    });

    setInterval(() => {
      if (!locked && startScreen.style.display === "none") {
        showHint();
      }
    }, 800);
  </script>
</body>
</html>
