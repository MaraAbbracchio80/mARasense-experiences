<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Living Painting - Test Tracking</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      margin: 0 0 12px 0;
      font-size: 24px;
    }

    #startScreen p {
      margin: 0 0 20px 0;
      font-size: 15px;
      max-width: 320px;
      line-height: 1.5;
      color: #ddd;
    }

    #startButton {
      background: #8A2BE2;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
    }

    #hint {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 90vw;
      display: none;
    }

    a-scene {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>Living Painting</h1>
    <p>Premi il pulsante e inquadra l'immagine target. Se il tracking funziona, comparirà il riquadro viola.</p>
    <button id="startButton">Avvia esperienza</button>
  </div>

  <div id="hint">Inquadra bene l'immagine target</div>

  <a-scene
    id="arScene"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true, physicallyCorrectLights"
    color-space="sRGB"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: yes; uiScanning: yes; uiError: yes; autoStart: false;"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        color="#8A2BE2"
        opacity="0.85"
        position="0 0 0"
        width="1"
        height="0.7"
      ></a-plane>

      <a-text
        value="Tracking OK"
        color="#ffffff"
        align="center"
        width="2"
        position="0 0 0.01"
      ></a-text>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const hint = document.getElementById("hint");
    const sceneEl = document.querySelector("#arScene");

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Avvio...";

      const startAR = () => {
        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (!mindarSystem) {
          startButton.disabled = false;
          startButton.textContent = "Riprova";
          return;
        }

        mindarSystem.start();
        startScreen.style.display = "none";
        hint.style.display = "block";
      };

      if (sceneEl.hasLoaded) {
        startAR();
      } else {
        sceneEl.addEventListener("loaded", startAR, { once: true });
      }
    });
  </script>
</body>
</html>
