<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Living Painting - Overlay Test</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startButton {
      background: #8A2BE2;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 14px;
    }

    #debugBox {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.78);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 92vw;
      line-height: 1.4;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
    }

    video, canvas {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>Living Painting</h1>
    <p>schiaccia Avvia esperienza e inquadra il quadro. Se tutto è corretto, vedrai un pannello viola sopra il dipinto.</p>
    <button id="startButton">Avvia esperienza</button>
  </div>

  <div id="debugBox">Stato: attesa avvio</div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    color-space="sRGB"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: yes; uiScanning: yes; uiError: yes; autoStart: false;"
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-plane
        id="panel"
        color="#8A2BE2"
        opacity="0.9"
        position="0 0 0"
        width="1"
        height="1.35"
      ></a-plane>

      <a-text
        value="Living Painting"
        color="#ffffff"
        align="center"
        width="2"
        position="0 0 0.01"
      ></a-text>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const debugBox = document.getElementById("debugBox");
    const sceneEl = document.getElementById("arScene");
    const target0 = document.getElementById("target0");

    function setDebug(text) {
      debugBox.textContent = "Stato: " + text;
      console.log(text);
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Avvio...";

      const startAR = async () => {
        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (!mindarSystem) {
          setDebug("mindar-image-system non trovato");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
          return;
        }

        try {
          await mindarSystem.start();
          startScreen.style.display = "none";
          setDebug("AR avviata. Inquadra il quadro.");
        } catch (err) {
          console.error(err);
          setDebug("errore avvio AR");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
        }
      };

      if (sceneEl.hasLoaded) {
        startAR();
      } else {
        sceneEl.addEventListener("loaded", startAR, { once: true });
      }
    });

    sceneEl.addEventListener("arReady", () => {
      setDebug("MindAR pronto");
    });

    sceneEl.addEventListener("arError", () => {
      setDebug("errore MindAR");
    });

    target0.addEventListener("targetFound", () => {
      setDebug("target trovato");
    });

    target0.addEventListener("targetLost", () => {
      setDebug("target perso");
    });
  </script>
</body>
</html>
