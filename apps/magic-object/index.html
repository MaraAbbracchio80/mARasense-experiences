<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magic Object Premium</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
      touch-action: manipulation;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #0b1020, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: white;
      text-align: center;
      padding: 24px;
    }

    #startBtn {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      background: #00c2ff;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0,194,255,0.25);
    }

    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      text-align: center;
      backdrop-filter: blur(4px);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="startScreen">
    <h1>Magic Object</h1>
    <p>Tocca il pulsante per attivare camera, audio ed effetto premium</p>
    <button id="startBtn">Avvia esperienza</button>
  </div>

  <div id="hint">Tocca lo schermo per spostare e rilanciare l’effetto</div>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>

  <audio id="fxAudio" preload="auto" src="./assets/audio/aggressive-sci-fi.mp3"></audio>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

  <script>
    const startBtn = document.getElementById("startBtn");
    const startScreen = document.getElementById("startScreen");
    const hint = document.getElementById("hint");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("threeCanvas");
    const fxAudio = document.getElementById("fxAudio");

    let scene, camera3D, renderer;
    let logoMesh = null;
    let glowMesh = null;
    let shockwaveMesh = null;
    let particles = null;
    let particleMaterial = null;
    let particleGeometry = null;
    let logoTexture = null;

    let started = false;
    let phase = "idle";
    let phaseStart = 0;
    let reformAudioPlayed = false;

    let effectCenter = new THREE.Vector3(0, 0, 0);
    let targetCenter = new THREE.Vector3(0, 0, 0);

    const clock = new THREE.Clock();

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play().then(resolve).catch(resolve);
        };
      });
    }

    function playEffectAudio(reset = true, volume = 1) {
      try {
        fxAudio.volume = volume;
        if (reset) {
          fxAudio.pause();
          fxAudio.currentTime = 0;
        }
        fxAudio.play().catch(() => {});
      } catch (e) {}
    }

    function init3D() {
      scene = new THREE.Scene();

      camera3D = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
      );
      camera3D.position.set(0, 0, 2.5);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x334455, 1.2);
      scene.add(hemi);

      const dir1 = new THREE.DirectionalLight(0xffffff, 0.9);
      dir1.position.set(1.5, 2, 3);
      scene.add(dir1);

      const dir2 = new THREE.DirectionalLight(0x66ccff, 0.35);
      dir2.position.set(-2, 1, 2);
      scene.add(dir2);

      loadLogoTexture();
      animate();

      window.addEventListener("pointerdown", onPointerDown);
    }

    function onPointerDown(event) {
      if (!logoTexture || startScreen.style.display !== "none") return;

      const x = (event.clientX / window.innerWidth) * 2 - 1;
      const y = -(event.clientY / window.innerHeight) * 2 + 1;

      targetCenter.set(x * 0.9, y * 1.4, 0);

      restartEffect();
    }

    function loadLogoTexture() {
      const loader = new THREE.TextureLoader();
      loader.load(
        "./assets/images/logo.png",
        (texture) => {
          logoTexture = texture;
          createLogo();
          createGlow();
          createShockwave();
          restartEffect();
          hint.style.display = "block";
        },
        undefined,
        (err) => {
          console.error("Errore caricamento logo.png:", err);
        }
      );
    }

    function createLogo() {
      if (logoMesh) {
        scene.remove(logoMesh);
        logoMesh.geometry.dispose();
        logoMesh.material.dispose();
      }

      const img = logoTexture.image;
      const aspect = img.width / img.height;

      const width = 1.45;
      const height = width / aspect;

      const geometry = new THREE.PlaneGeometry(width, height);
      const material = new THREE.MeshBasicMaterial({
        map: logoTexture,
        transparent: true,
        opacity: 0,
        depthWrite: false
      });

      logoMesh = new THREE.Mesh(geometry, material);
      logoMesh.position.copy(effectCenter).add(new THREE.Vector3(0, 0, 0.02));
      scene.add(logoMesh);
    }

    function createGlow() {
      if (glowMesh) {
        scene.remove(glowMesh);
        glowMesh.geometry.dispose();
        glowMesh.material.dispose();
      }

      const geometry = new THREE.PlaneGeometry(1.9, 1.9);
      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uOpacity: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform float uOpacity;
          void main() {
            vec2 p = vUv - vec2(0.5);
            float d = length(p);
            float glow = smoothstep(0.55, 0.0, d);
            vec3 color = mix(vec3(0.0, 0.5, 1.0), vec3(0.8, 0.97, 1.0), glow);
            gl_FragColor = vec4(color, glow * 0.42 * uOpacity);
          }
        `
      });

      glowMesh = new THREE.Mesh(geometry, material);
      glowMesh.position.copy(effectCenter).add(new THREE.Vector3(0, 0, -0.02));
      scene.add(glowMesh);
    }

    function createShockwave() {
      if (shockwaveMesh) {
        scene.remove(shockwaveMesh);
        shockwaveMesh.geometry.dispose();
        shockwaveMesh.material.dispose();
      }

      const geometry = new THREE.RingGeometry(0.2, 0.24, 64);
      const material = new THREE.MeshBasicMaterial({
        color: 0x88eeff,
        transparent: true,
        opacity: 0,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      shockwaveMesh = new THREE.Mesh(geometry, material);
      shockwaveMesh.position.copy(effectCenter).add(new THREE.Vector3(0, 0, 0.01));
      scene.add(shockwaveMesh);
    }

    function createParticlesFromLogoShape() {
      if (particles) {
        scene.remove(particles);
        particleGeometry.dispose();
        particleMaterial.dispose();
        particles = null;
      }

      const img = logoTexture.image;
      const sampleCanvas = document.createElement("canvas");
      const ctx = sampleCanvas.getContext("2d", { willReadFrequently: true });

      const maxDim = 240;
      const aspect = img.width / img.height;

      if (img.width >= img.height) {
        sampleCanvas.width = maxDim;
        sampleCanvas.height = Math.round(maxDim / aspect);
      } else {
        sampleCanvas.height = maxDim;
        sampleCanvas.width = Math.round(maxDim * aspect);
      }

      ctx.drawImage(img, 0, 0, sampleCanvas.width, sampleCanvas.height);

      const imageData = ctx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height).data;

      const positions = [];
      const offsets = [];
      const sizes = [];
      const colors = [];

      const widthWorld = 1.45;
      const heightWorld = widthWorld / aspect;

      for (let y = 0; y < sampleCanvas.height; y += 2) {
        for (let x = 0; x < sampleCanvas.width; x += 2) {
          const i = (y * sampleCanvas.width + x) * 4;
          const r = imageData[i] / 255;
          const g = imageData[i + 1] / 255;
          const b = imageData[i + 2] / 255;
          const a = imageData[i + 3];

          if (a > 40) {
            const px = (x / sampleCanvas.width - 0.5) * widthWorld;
            const py = -(y / sampleCanvas.height - 0.5) * heightWorld;
            const pz = (Math.random() - 0.5) * 0.02;

            positions.push(px, py, pz);

            const angle = Math.atan2(py, px);
            const radiusBoost = 0.35 + Math.random() * 0.95;
            const randomSpread = 0.10 + Math.random() * 0.30;

            offsets.push(
              px + Math.cos(angle) * radiusBoost + (Math.random() - 0.5) * randomSpread,
              py + Math.sin(angle) * radiusBoost + (Math.random() - 0.5) * randomSpread,
              pz + (Math.random() - 0.5) * 0.9
            );

            sizes.push(0.010 + Math.random() * 0.014);
            colors.push(r, g, b);
          }
        }
      }

      particleGeometry = new THREE.BufferGeometry();
      particleGeometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      particleGeometry.setAttribute("aOffset", new THREE.Float32BufferAttribute(offsets, 3));
      particleGeometry.setAttribute("aSize", new THREE.Float32BufferAttribute(sizes, 1));
      particleGeometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));

      particleMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexColors: true,
        uniforms: {
          uProgress: { value: 0 },
          uOpacity: { value: 1 }
        },
        vertexShader: `
          attribute vec3 aOffset;
          attribute float aSize;
          uniform float uProgress;
          varying float vAlpha;
          varying vec3 vColor;

          void main() {
            vec3 displaced = mix(position, aOffset, uProgress);
            vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
            gl_PointSize = aSize * 900.0 / -mvPosition.z;
            gl_Position = projectionMatrix * mvPosition;
            vAlpha = 1.0 - abs(uProgress - 0.5) * 2.0;
            vColor = color;
          }
        `,
        fragmentShader: `
          uniform float uOpacity;
          varying float vAlpha;
          varying vec3 vColor;

          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float d = length(uv);
            float alpha = smoothstep(0.5, 0.0, d) * vAlpha * uOpacity;
            gl_FragColor = vec4(vColor, alpha);
          }
        `
      });

      particles = new THREE.Points(particleGeometry, particleMaterial);
      particles.position.copy(effectCenter).add(new THREE.Vector3(0, 0, 0.05));
      scene.add(particles);
    }

    function restartEffect() {
      if (!logoMesh || !glowMesh || !shockwaveMesh) return;

      if (particles) {
        scene.remove(particles);
        particleGeometry.dispose();
        particleMaterial.dispose();
        particles = null;
      }

      reformAudioPlayed = false;
      playEffectAudio(true, 1);

      phase = "logo-in";
      phaseStart = clock.getElapsedTime();

      logoMesh.visible = true;
      logoMesh.material.opacity = 0;
      logoMesh.scale.set(0.82, 0.82, 0.82);
      logoMesh.rotation.set(0, 0, 0);
      logoMesh.position.copy(effectCenter).add(new THREE.Vector3(0, 0, 0.02));

      glowMesh.visible = true;
      glowMesh.material.uniforms.uOpacity.value = 0;
      glowMesh.scale.set(0.7, 0.7, 0.7);
      glowMesh.position.copy(effectCenter).add(new THREE.Vector3(0, 0, -0.02));

      shockwaveMesh.visible = true;
      shockwaveMesh.material.opacity = 0;
      shockwaveMesh.scale.set(0.4, 0.4, 0.4);
      shockwaveMesh.position.copy(effectCenter).add(new THREE.Vector3(0, 0, 0.01));
    }

    function updateEffect(time) {
      if (!logoMesh || !glowMesh || !shockwaveMesh) return;

      effectCenter.lerp(targetCenter, 0.08);

      if (logoMesh.visible) logoMesh.position.x = effectCenter.x;
      if (logoMesh.visible) logoMesh.position.y = effectCenter.y + Math.sin(time * 1.8) * 0.02;

      if (glowMesh.visible) {
        glowMesh.position.x = effectCenter.x;
        glowMesh.position.y = effectCenter.y;
      }

      if (shockwaveMesh.visible) {
        shockwaveMesh.position.x = effectCenter.x;
        shockwaveMesh.position.y = effectCenter.y;
      }

      if (particles) {
        particles.position.x = effectCenter.x;
        particles.position.y = effectCenter.y;
      }

      const t = time - phaseStart;

      if (phase === "logo-in") {
        const p = Math.min(t / 1.4, 1);
        const eased = 1 - Math.pow(1 - p, 3);

        logoMesh.material.opacity = eased;
        logoMesh.scale.setScalar(0.82 + eased * 0.18);
        logoMesh.rotation.z = Math.sin(time * 1.2) * 0.02;

        glowMesh.material.uniforms.uOpacity.value = eased;
        glowMesh.scale.setScalar(0.72 + eased * 0.28);

        const shockP = Math.min(t / 0.9, 1);
        shockwaveMesh.material.opacity = (1 - shockP) * 0.75;
        shockwaveMesh.scale.setScalar(0.4 + shockP * 2.8);

        if (p >= 1) {
          phase = "hold";
          phaseStart = time;
        }
      } else if (phase === "hold") {
        logoMesh.material.opacity = 1;
        logoMesh.rotation.z = Math.sin(time * 1.4) * 0.03;

        glowMesh.material.uniforms.uOpacity.value = 1;
        glowMesh.scale.setScalar(1 + Math.sin(time * 2.2) * 0.04);

        shockwaveMesh.material.opacity = 0;

        if (t >= 1.2) {
          createParticlesFromLogoShape();
          phase = "explode";
          phaseStart = time;
        }
      } else if (phase === "explode") {
        const p = Math.min(t / 2.2, 1);

        logoMesh.material.opacity = Math.max(1 - p * 2.2, 0);
        logoMesh.scale.setScalar(1 + p * 0.12);

        glowMesh.material.uniforms.uOpacity.value = Math.max(1 - p * 0.8, 0);
        glowMesh.scale.setScalar(1 + p * 0.75);

        if (particles) {
          particleMaterial.uniforms.uProgress.value = p;
          particleMaterial.uniforms.uOpacity.value = 1;
          particles.rotation.z += 0.0012;
          particles.rotation.y = Math.sin(time * 0.8) * 0.12;
        }

        if (p >= 1) {
          logoMesh.visible = false;
          glowMesh.visible = false;
          shockwaveMesh.visible = false;
          phase = "reform";
          phaseStart = time;
        }
      } else if (phase === "reform") {
        const p = Math.min(t / 2.0, 1);

        if (!reformAudioPlayed && t > 0.15) {
          reformAudioPlayed = true;
          playEffectAudio(true, 0.9);
        }

        if (particles) {
          particleMaterial.uniforms.uProgress.value = 1 - p;
          particleMaterial.uniforms.uOpacity.value = 1;
          particles.rotation.z *= 0.988;
          particles.rotation.y *= 0.988;
        }

        if (p >= 1) {
          if (particles) {
            scene.remove(particles);
            particleGeometry.dispose();
            particleMaterial.dispose();
            particles = null;
          }

          logoMesh.visible = true;
          glowMesh.visible = true;
          shockwaveMesh.visible = false;

          logoMesh.material.opacity = 1;
          logoMesh.scale.set(1, 1, 1);
          glowMesh.material.uniforms.uOpacity.value = 1;

          phase = "final-hold";
          phaseStart = time;
        }
      } else if (phase === "final-hold") {
        logoMesh.rotation.z = Math.sin(time * 1.1) * 0.018;
        logoMesh.scale.setScalar(1 + Math.sin(time * 1.7) * 0.015);
        glowMesh.scale.setScalar(1 + Math.sin(time * 2.0) * 0.03);

        if (t >= 1.2) {
          phase = "done";
          phaseStart = time;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();
      updateEffect(time);

      if (renderer && scene && camera3D) {
        renderer.render(scene, camera3D);
      }
    }

    startBtn.onclick = async function() {
      if (started) return;
      started = true;

      try {
        await startCamera();
        startScreen.style.display = "none";
        init3D();
      } catch (err) {
        console.error(err);
        started = false;
      }
    };

    window.addEventListener("resize", function() {
      if (!camera3D || !renderer) return;

      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
