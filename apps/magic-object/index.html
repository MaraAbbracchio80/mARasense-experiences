<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magic Object</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #101626, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: white;
      text-align: center;
      padding: 24px;
    }

    #startBtn {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      background: #00c2ff;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
    }

    #debug {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(0,0,0,0.65);
      color: white;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      max-width: 92vw;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="startScreen">
    <h1>Magic Object</h1>
    <p>Tocca il pulsante per attivare camera e modello 3D</p>
    <button id="startBtn">riAvvia 2</button>
  </div>

  <div id="debug">Stato: pagina caricata</div>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    alert("JS CARICATO");

    const startBtn = document.getElementById("startBtn");
    const startScreen = document.getElementById("startScreen");
    const debug = document.getElementById("debug");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("threeCanvas");

    let scene, camera3D, renderer, model;
    let started = false;

    function setDebug(text) {
      debug.textContent = "Stato: " + text;
      console.log(text);
    }

    async function startCamera() {
      setDebug("richiesta camera...");
      alert("Richiesta camera...");

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play().then(resolve).catch(resolve);
        };
      });

      alert("Camera attiva");
      setDebug("camera attiva");
    }

    function init3D() {
      setDebug("inizializzo 3D...");

      scene = new THREE.Scene();

      camera3D = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
      );
      camera3D.position.z = 2;

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x8899bb, 1.2);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(1, 2, 3);
      scene.add(dir);

      loadModel();
      animate();

      setDebug("3D avviato");
    }

    function loadModel() {
      setDebug("carico modello...");

      const loader = new THREE.GLTFLoader();

      loader.load(
        "./assets/models/object.glb",
        function(gltf) {
          model = gltf.scene;
          model.scale.set(0.5, 0.5, 0.5);
          model.position.set(0, 0, 0);
          scene.add(model);
          setDebug("modello caricato");
        },
        undefined,
        function(error) {
          console.error(error);
          setDebug("errore caricamento modello");
          alert("Errore caricamento object.glb");
        }
      );
    }

    function animate() {
      requestAnimationFrame(animate);

      if (model) {
        model.rotation.y += 0.01;
      }

      if (renderer && scene && camera3D) {
        renderer.render(scene, camera3D);
      }
    }

    startBtn.onclick = async function() {
      if (started) return;
      started = true;

      try {
        setDebug("click ok");
        alert("CLICK OK");

        await startCamera();

        startScreen.style.display = "none";

        init3D();
      } catch (err) {
        console.error(err);
        setDebug("errore: " + err.message);
        alert("Errore: " + err.message);
        started = false;
      }
    };

    window.addEventListener("resize", function() {
      if (!camera3D || !renderer) return;

      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
