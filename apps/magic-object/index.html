<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Object - WebXR</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #101626, #000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: white;
      text-align: center;
    }

    #startButton {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      background: #00c2ff;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
    }

    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      padding: 10px 14px;
      border-radius: 10px;
      color: white;
      display: none;
    }
  </style>
</head>
<body>

<div id="startScreen">
  <h1>Magic Object</h1>
  <p>Tocca per posizionare l’oggetto nello spazio</p>
  <button id="startButton">Avvia esperienza</button>
</div>

<div id="hint">Tocca lo schermo per posizionare</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { ARButton } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let controller;
let model;

init();

function init() {

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);

  const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
  scene.add(light);

  document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  loadModel();

  renderer.setAnimationLoop(render);
}

function loadModel() {
  const loader = new GLTFLoader();

  loader.load('./assets/models/object.glb', (gltf) => {
    model = gltf.scene;
    model.scale.set(0.3, 0.3, 0.3);
  });
}

function onSelect() {
  if (!model) return;

  const clone = model.clone();

  clone.position.set(0, 0, -1);
  scene.add(clone);

  // animazione base
  animateObject(clone);
}

function animateObject(obj) {
  const speed = 0.01;

  function rotate() {
    obj.rotation.y += speed;
    requestAnimationFrame(rotate);
  }

  rotate();
}

function render() {
  renderer.render(scene, camera);
}

</script>

</body>
</html>
