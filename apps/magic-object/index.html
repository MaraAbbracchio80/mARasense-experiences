<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Magic Object Premium</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, #0b1020, #000);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      color: white;
      text-align: center;
      padding: 24px;
    }

    #startBtn {
      margin-top: 20px;
      padding: 14px 24px;
      font-size: 16px;
      background: #00c2ff;
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0,194,255,0.25);
    }

    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      color: white;
      background: rgba(0,0,0,0.55);
      padding: 10px 14px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      text-align: center;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <div id="startScreen">
    <h1>Magic Object</h1>
    <p>Tocca il pulsante per attivare camera ed effetto particellare premium</p>
    <button id="startBtn">Avvia esperienza</button>
  </div>

  <div id="hint">Tocca lo schermo per rilanciare l’effetto</div>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

  <script>
    const startBtn = document.getElementById("startBtn");
    const startScreen = document.getElementById("startScreen");
    const hint = document.getElementById("hint");
    const video = document.getElementById("camera");
    const canvas = document.getElementById("threeCanvas");

    let scene, camera3D, renderer;
    let logoMesh = null;
    let glowMesh = null;
    let particles = null;
    let particleMaterial = null;
    let particleGeometry = null;
    let logoTexture = null;

    let started = false;
    let phase = "idle";
    let phaseStart = 0;

    const clock = new THREE.Clock();

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play().then(resolve).catch(resolve);
        };
      });
    }

    function init3D() {
      scene = new THREE.Scene();

      camera3D = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        100
      );
      camera3D.position.set(0, 0, 2.5);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(window.innerWidth, window.innerHeight);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x334455, 1.2);
      scene.add(hemi);

      const dir1 = new THREE.DirectionalLight(0xffffff, 0.9);
      dir1.position.set(1.5, 2, 3);
      scene.add(dir1);

      const dir2 = new THREE.DirectionalLight(0x66ccff, 0.35);
      dir2.position.set(-2, 1, 2);
      scene.add(dir2);

      loadLogoTexture();
      animate();

      window.addEventListener("pointerdown", () => {
        if (!logoTexture) return;
        restartEffect();
      });
    }

    function loadLogoTexture() {
      const loader = new THREE.TextureLoader();
      loader.load(
        "./assets/images/logo.png",
        (texture) => {
          logoTexture = texture;
          createLogo();
          createGlow();
          restartEffect();
          hint.style.display = "block";
        },
        undefined,
        (err) => {
          console.error("Errore caricamento logo.png:", err);
        }
      );
    }

    function createLogo() {
      if (logoMesh) {
        scene.remove(logoMesh);
        logoMesh.geometry.dispose();
        logoMesh.material.dispose();
      }

      const img = logoTexture.image;
      const aspect = img.width / img.height;

      const width = 1.45;
      const height = width / aspect;

      const geometry = new THREE.PlaneGeometry(width, height);
      const material = new THREE.MeshBasicMaterial({
        map: logoTexture,
        transparent: true,
        opacity: 0,
        depthWrite: false
      });

      logoMesh = new THREE.Mesh(geometry, material);
      logoMesh.position.set(0, 0, 0.02);
      scene.add(logoMesh);
    }

    function createGlow() {
      if (glowMesh) {
        scene.remove(glowMesh);
        glowMesh.geometry.dispose();
        glowMesh.material.dispose();
      }

      const geometry = new THREE.PlaneGeometry(1.8, 1.8);
      const material = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uOpacity: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          uniform float uOpacity;
          void main() {
            vec2 p = vUv - vec2(0.5);
            float d = length(p);
            float glow = smoothstep(0.55, 0.0, d);
            vec3 color = mix(vec3(0.0, 0.5, 1.0), vec3(0.7, 0.95, 1.0), glow);
            gl_FragColor = vec4(color, glow * 0.45 * uOpacity);
          }
        `
      });

      glowMesh = new THREE.Mesh(geometry, material);
      glowMesh.position.set(0, 0, -0.02);
      scene.add(glowMesh);
    }

    function createParticlesFromLogoShape() {
      if (particles) {
        scene.remove(particles);
        particleGeometry.dispose();
        particleMaterial.dispose();
        particles = null;
      }

      const img = logoTexture.image;
      const sampleCanvas = document.createElement("canvas");
      const ctx = sampleCanvas.getContext("2d", { willReadFrequently: true });

      const maxDim = 220;
      const aspect = img.width / img.height;

      if (img.width >= img.height) {
        sampleCanvas.width = maxDim;
        sampleCanvas.height = Math.round(maxDim / aspect);
      } else {
        sampleCanvas.height = maxDim;
        sampleCanvas.width = Math.round(maxDim * aspect);
      }

      ctx.drawImage(img, 0, 0, sampleCanvas.width, sampleCanvas.height);

      const imageData = ctx.getImageData(0, 0, sampleCanvas.width, sampleCanvas.height).data;

      const positions = [];
      const offsets = [];
      const sizes = [];

      const widthWorld = 1.45;
      const heightWorld = widthWorld / aspect;

      for (let y = 0; y < sampleCanvas.height; y += 2) {
        for (let x = 0; x < sampleCanvas.width; x += 2) {
          const i = (y * sampleCanvas.width + x) * 4;
          const alpha = imageData[i + 3];

          if (alpha > 40) {
            const px = (x / sampleCanvas.width - 0.5) * widthWorld;
            const py = -(y / sampleCanvas.height - 0.5) * heightWorld;
            const pz = (Math.random() - 0.5) * 0.02;

            positions.push(px, py, pz);

            const angle = Math.atan2(py, px);
            const radiusBoost = 0.35 + Math.random() * 0.9;
            const randomSpread = 0.12 + Math.random() * 0.35;

            offsets.push(
              px + Math.cos(angle) * radiusBoost + (Math.random() - 0.5) * randomSpread,
              py + Math.sin(angle) * radiusBoost + (Math.random() - 0.5) * randomSpread,
              pz + (Math.random() - 0.5) * 0.9
            );

            sizes.push(0.012 + Math.random() * 0.016);
          }
        }
      }

      particleGeometry = new THREE.BufferGeometry();
      particleGeometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      particleGeometry.setAttribute("aOffset", new THREE.Float32BufferAttribute(offsets, 3));
      particleGeometry.setAttribute("aSize", new THREE.Float32BufferAttribute(sizes, 1));

      particleMaterial = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        uniforms: {
          uProgress: { value: 0 },
          uOpacity: { value: 1 }
        },
        vertexShader: `
          attribute vec3 aOffset;
          attribute float aSize;
          uniform float uProgress;
          varying float vAlpha;

          void main() {
            vec3 displaced = mix(position, aOffset, uProgress);
            vec4 mvPosition = modelViewMatrix * vec4(displaced, 1.0);
            gl_PointSize = aSize * 900.0 / -mvPosition.z;
            gl_Position = projectionMatrix * mvPosition;
            vAlpha = 1.0 - uProgress;
          }
        `,
        fragmentShader: `
          uniform float uOpacity;
          varying float vAlpha;

          void main() {
            vec2 uv = gl_PointCoord - vec2(0.5);
            float d = length(uv);
            float alpha = smoothstep(0.5, 0.0, d) * vAlpha * uOpacity;
            vec3 color = mix(vec3(0.0, 0.7, 1.0), vec3(0.85, 0.97, 1.0), 0.5);
            gl_FragColor = vec4(color, alpha);
          }
        `
      });

      particles = new THREE.Points(particleGeometry, particleMaterial);
      particles.position.set(0, 0, 0.05);
      scene.add(particles);
    }

    function restartEffect() {
      if (!logoMesh || !glowMesh) return;

      if (particles) {
        scene.remove(particles);
        particleGeometry.dispose();
        particleMaterial.dispose();
        particles = null;
      }

      logoMesh.visible = true;
      logoMesh.material.opacity = 0;
      logoMesh.scale.set(0.82, 0.82, 0.82);
      logoMesh.rotation.set(0, 0, 0);

      glowMesh.visible = true;
      glowMesh.material.uniforms.uOpacity.value = 0;
      glowMesh.scale.set(0.7, 0.7, 0.7);

      phase = "logo-in";
      phaseStart = clock.getElapsedTime();
    }

    function updateEffect(time) {
      if (!logoMesh || !glowMesh) return;

      const t = time - phaseStart;

      if (phase === "logo-in") {
        const p = Math.min(t / 1.1, 1);
        const eased = 1 - Math.pow(1 - p, 3);

        logoMesh.material.opacity = eased;
        logoMesh.scale.setScalar(0.82 + eased * 0.18);
        logoMesh.position.y = Math.sin(time * 1.6) * 0.015;

        glowMesh.material.uniforms.uOpacity.value = eased;
        glowMesh.scale.setScalar(0.72 + eased * 0.28);

        if (p >= 1) {
          phase = "hold";
          phaseStart = time;
        }
      } else if (phase === "hold") {
        logoMesh.material.opacity = 1;
        logoMesh.position.y = Math.sin(time * 1.8) * 0.02;
        logoMesh.rotation.z = Math.sin(time * 1.4) * 0.03;

        glowMesh.material.uniforms.uOpacity.value = 1;
        glowMesh.scale.setScalar(1 + Math.sin(time * 2.2) * 0.04);

        if (t >= 0.9) {
          createParticlesFromLogoShape();
          phase = "explode";
          phaseStart = time;
        }
      } else if (phase === "explode") {
        const p = Math.min(t / 1.8, 1);

        logoMesh.material.opacity = Math.max(1 - p * 2.4, 0);
        logoMesh.scale.setScalar(1 + p * 0.08);
        logoMesh.rotation.z = Math.sin(time * 8.0) * 0.01;

        glowMesh.material.uniforms.uOpacity.value = Math.max(1 - p * 0.9, 0);
        glowMesh.scale.setScalar(1 + p * 0.55);

        if (particles) {
          particleMaterial.uniforms.uProgress.value = p;
          particleMaterial.uniforms.uOpacity.value = 1 - p * 0.08;
          particles.rotation.z += 0.0015;
          particles.rotation.y = Math.sin(time * 0.8) * 0.12;
        }

        if (p >= 1) {
          logoMesh.visible = false;
          glowMesh.visible = false;
          phase = "done";
          phaseStart = time;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();
      updateEffect(time);

      if (renderer && scene && camera3D) {
        renderer.render(scene, camera3D);
      }
    }

    startBtn.onclick = async function() {
      if (started) return;
      started = true;

      try {
        await startCamera();
        startScreen.style.display = "none";
        init3D();
      } catch (err) {
        console.error(err);
        started = false;
      }
    };

    window.addEventListener("resize", function() {
      if (!camera3D || !renderer) return;

      camera3D.aspect = window.innerWidth / window.innerHeight;
      camera3D.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
