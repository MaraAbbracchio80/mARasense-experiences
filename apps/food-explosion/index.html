<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Food Explosion - Video AR</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #2a160c 0%, #000 78%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    #startScreen h1 {
      margin: 0 0 12px 0;
      font-size: 28px;
    }

    #startScreen p {
      margin: 0 0 20px 0;
      font-size: 15px;
      max-width: 340px;
      line-height: 1.5;
      color: #ddd;
    }

    #startButton {
      background: #ff7a00;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 122, 0, 0.28);
    }

    #debugBox {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(0,0,0,0.68);
      color: #fff;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      text-align: center;
      max-width: 92vw;
      line-height: 1.4;
      backdrop-filter: blur(4px);
    }

    #scanText {
      position: fixed;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      z-index: 9998;
      color: #fff;
      font-size: 14px;
      background: rgba(0,0,0,0.60);
      padding: 10px 14px;
      border-radius: 10px;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 10;
    }

    video {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    canvas {
      position: fixed !important;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
      z-index: 2 !important;
      background: transparent !important;
    }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1>Food Explosion</h1>
    <p>Premi Avvia esperienza e inquadra la pizza. Il video partirà sopra il piatto.</p>
    <button id="startButton">Avvia esperienza</button>
  </div>

  <div id="debugBox">Stato: attesa avvio</div>
  <div id="scanText">Inquadra bene la pizza</div>

  <a-scene
    id="arScene"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true"
    color-space="sRGB"
    mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no; uiError: no; autoStart: false;"
  >
    <a-assets>
      <video
        id="foodVideo"
        src="./assets/videos/il-gusto-prende-vita.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="smoothWrapper">
        <a-plane
          id="videoPlane"
          src="#foodVideo"
          position="0 0 0.04"
          width="1.30"
          height="1.30"
          material="shader: flat; transparent: true; opacity: 1"
          visible="false"
        ></a-plane>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const debugBox = document.getElementById("debugBox");
    const scanText = document.getElementById("scanText");
    const sceneEl = document.getElementById("arScene");
    const target0 = document.getElementById("target0");
    const smoothWrapper = document.getElementById("smoothWrapper");
    const videoPlane = document.getElementById("videoPlane");
    const foodVideo = document.getElementById("foodVideo");

    let targetVisible = false;
    let smoothingInitialized = false;
    let videoFinished = false;

    const smoothed = {
      position: new THREE.Vector3(),
      quaternion: new THREE.Quaternion(),
      scale: new THREE.Vector3(1, 1, 1)
    };

    function setDebug(text) {
      debugBox.textContent = "Stato: " + text;
      console.log(text);
    }

    function showHint(text = "Inquadra bene la pizza") {
      scanText.textContent = text;
      scanText.style.display = "block";
    }

    function hideHint() {
      scanText.style.display = "none";
    }

    function showVideoPlane() {
      videoPlane.setAttribute("visible", true);
      videoPlane.object3D.visible = true;
    }

    function hideVideoPlane() {
      videoPlane.setAttribute("visible", false);
      videoPlane.object3D.visible = false;
    }

    async function playFromStart() {
      try {
        foodVideo.pause();
        foodVideo.currentTime = 0;
        await foodVideo.play();
      } catch (e) {
        console.warn("Errore play video:", e);
      }
    }

    function initializeSmoothing() {
      const targetObj = target0.object3D;
      const wrapperObj = smoothWrapper.object3D;

      smoothed.position.copy(targetObj.position);
      smoothed.quaternion.copy(targetObj.quaternion);
      smoothed.scale.copy(targetObj.scale);

      wrapperObj.position.copy(smoothed.position);
      wrapperObj.quaternion.copy(smoothed.quaternion);
      wrapperObj.scale.copy(smoothed.scale);

      smoothingInitialized = true;
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      startButton.textContent = "Avvio...";

      const startAR = async () => {
        const mindarSystem = sceneEl.systems["mindar-image-system"];
        if (!mindarSystem) {
          setDebug("mindar-image-system non trovato");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
          return;
        }

        try {
          await mindarSystem.start();
          startScreen.style.display = "none";
          hideVideoPlane();
          showHint();
          setDebug("AR avviata. Ricerca target...");
        } catch (err) {
          console.error(err);
          setDebug("errore avvio AR");
          startButton.disabled = false;
          startButton.textContent = "Riprova";
        }
      };

      if (sceneEl.hasLoaded) {
        startAR();
      } else {
        sceneEl.addEventListener("loaded", startAR, { once: true });
      }
    });

    sceneEl.addEventListener("arReady", () => {
      setDebug("MindAR pronto");
    });

    sceneEl.addEventListener("arError", () => {
      setDebug("errore MindAR");
    });

    target0.addEventListener("targetFound", async () => {
      targetVisible = true;
      hideHint();
      initializeSmoothing();

      if (videoFinished) {
        videoFinished = false;
      }

      showVideoPlane();
      setDebug("target trovato");
      await playFromStart();
    });

    target0.addEventListener("targetLost", () => {
      targetVisible = false;
      smoothingInitialized = false;
      foodVideo.pause();
      foodVideo.currentTime = 0;
      hideVideoPlane();
      showHint("Target perso. Riinquadra la pizza.");
      setDebug("target perso");
    });

    foodVideo.addEventListener("ended", () => {
      foodVideo.pause();
      foodVideo.currentTime = 0;
      videoFinished = true;
      hideVideoPlane();

      if (targetVisible) {
        showHint("Video finito. Esci e rientra sul target per farlo ripartire.");
        setDebug("video terminato");
      }
    });

    sceneEl.addEventListener("renderstart", () => {
      const renderer = sceneEl.renderer;

      renderer.setAnimationLoop(() => {
        renderer.render(sceneEl.object3D, sceneEl.camera);

        if (!targetVisible || !smoothingInitialized) return;

        const targetObj = target0.object3D;
        const wrapperObj = smoothWrapper.object3D;

        const positionLerp = 0.12;
        const rotationLerp = 0.10;
        const scaleLerp = 0.12;

        smoothed.position.lerp(targetObj.position, positionLerp);
        smoothed.quaternion.slerp(targetObj.quaternion, rotationLerp);
        smoothed.scale.lerp(targetObj.scale, scaleLerp);

        wrapperObj.position.copy(smoothed.position);
        wrapperObj.quaternion.copy(smoothed.quaternion);
        wrapperObj.scale.copy(smoothed.scale);
      });
    });

    setInterval(() => {
      if (!targetVisible && startScreen.style.display === "none") {
        showHint();
      }
    }, 800);
  </script>
</body>
</html>
