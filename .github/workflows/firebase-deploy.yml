name: Deploy Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm install

      - name: Create .env
        run: |
          cd functions
          echo "GITHUB_TOKEN=$${{ secrets.MARASENSE_GITHUB_TOKEN }}" >> .env
          echo "GITHUB_OWNER=MaraAbbracchio80" >> .env
          echo "GITHUB_REPO=mARasense-experiences" >> .env
          echo "GITHUB_BRANCH=main" >> .env

      - name: Deploy Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: marasenseexperiences-ar

      - name: Deploy Functions
        run: firebase deploy --only functions --project marasenseexperiences-ar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json

      - name: Write Service Account File
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > gcp-key.json