name: Deploy Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions Dependencies
        run: |
          cd functions
          npm install

      - name: Create .env
        run: |
          cd functions
          echo "GITHUB_TOKEN=${{ secrets.MARASENSE_GITHUB_TOKEN }}" >> .env
          echo "GITHUB_OWNER=MaraAbbracchio80" >> .env
          echo "GITHUB_REPO=mARasense-experiences" >> .env
          echo "GITHUB_BRANCH=main" >> .env

      - name: Write Service Account File
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcp-key.json

      - name: Set Google Credentials
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcp-key.json" >> $GITHUB_ENV

      - name: Debug Firebase files
        run: |
          pwd
          ls -la
          echo "---- firebase.json ----"
          cat firebase.json
          echo "---- functions ----"
          ls -la functions
          echo "Deploy triggered after CORS update"

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project marasenseexperiences-ar --force
        
      - name: Deploy Firebase Functions
        run: firebase deploy --only functions --project marasenseexperiences-ar --force
