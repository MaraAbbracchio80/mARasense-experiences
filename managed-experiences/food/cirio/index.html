<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MaraSense Experience</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }
    body { position: fixed; inset: 0; }
    a-scene, canvas, .a-canvas, .mindar-ui-overlay, .mindar-ui-scanning, .mindar-ui-loading, .mindar-ui-error {
      background: transparent !important;
    }
    a-scene { width: 100vw !important; height: 100vh !important; background: transparent !important; }
    .arContentAsset, #contentAudio { display: none; }
    #lensOverlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      background: transparent !important;
    }
    .lensBox { width: min(72vw, 330px); aspect-ratio: 1 / 1; border-radius: 32px; position: relative; }
    .corner { position: absolute; width: 58px; height: 58px; border-color: rgba(255,255,255,.95); filter: drop-shadow(0 0 8px rgba(138,43,226,.85)); }
    .corner.tl { top: 0; left: 0; border-top: 5px solid; border-left: 5px solid; border-radius: 28px 0 0 0; }
    .corner.tr { top: 0; right: 0; border-top: 5px solid; border-right: 5px solid; border-radius: 0 28px 0 0; }
    .corner.bl { bottom: 0; left: 0; border-bottom: 5px solid; border-left: 5px solid; border-radius: 0 0 0 28px; }
    .corner.br { bottom: 0; right: 0; border-bottom: 5px solid; border-right: 5px solid; border-radius: 0 0 28px 0; }
    .scanLine { position: absolute; left: 10%; right: 10%; height: 3px; top: 18%; border-radius: 999px; background: linear-gradient(90deg, transparent, #00eaff, #8a2be2, transparent); box-shadow: 0 0 18px rgba(0,234,255,.9); animation: scanMove 2.2s ease-in-out infinite; }
    @keyframes scanMove { 0% { top: 18%; opacity: .4; } 50% { top: 82%; opacity: 1; } 100% { top: 18%; opacity: .4; } }
    #statusText {
      position: fixed;
      left: 50%;
      bottom: max(32px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 25;
      width: min(88vw, 420px);
      text-align: center;
      color: white;
      font-size: 15px;
      line-height: 1.4;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 18px rgba(0,0,0,.28);
      display: none;
    }
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: radial-gradient(circle at top left, rgba(138,43,226,.32), transparent 34%), radial-gradient(circle at bottom right, rgba(0,234,255,.24), transparent 34%), #050505;
      color: white;
      text-align: center;
      padding: 24px;
    }
    #brandLogo { width: 110px; height: 110px; object-fit: contain; margin-bottom: 22px; animation: rotateLogo 8s linear infinite; }
    @keyframes rotateLogo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #startScreen h1 { margin: 0 0 10px; font-size: 26px; }
    #startScreen p { margin: 0 0 24px; max-width: 420px; color: #d7d7d7; line-height: 1.5; font-size: 15px; }
    #startButton, #retryButton {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #8a2be2, #00bcd4);
      box-shadow: 0 0 24px rgba(138,43,226,.38);
    }
    #startButton:disabled { opacity: .6; cursor: wait; }
    #errorBox {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 80;
      width: min(88vw, 540px);
      padding: 18px;
      background: rgba(0,0,0,.86);
      color: white;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.16);
      line-height: 1.5;
      text-align: center;
    }
    #errorBox p { margin: 0 0 14px; }
  </style>
</head>
<body>
  <div id="startScreen">
    <img id="brandLogo" src="/MARASENSELOGO.png" onerror="this.src='https://ndaprove.newdigitalapp.it/docs/MARASENSELOGO.png'" alt="MaraSense" />
    <h1 id="experienceTitle">MaraSense Experience</h1>
    <p>Premi il pulsante, consenti l’accesso alla fotocamera e inquadra il target.</p>
    <button id="startButton" onclick="startExperience()">Avvia esperienza</button>
  </div>

  <div id="lensOverlay">
    <div class="lensBox">
      <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="scanLine"></div>
    </div>
  </div>

  <div id="statusText">Inquadra il target</div>
  <div id="errorBox"></div>
  <audio id="contentAudio" preload="auto" crossorigin="anonymous"></audio>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false; alpha: true; antialias: true; logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    background="transparent: true"
  >
    <a-assets id="arAssets"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse"></a-camera>
    <a-entity id="targetsRoot"></a-entity>
  </a-scene>

  <script>
    const DEFAULT_CONFIG = {
      title: "MaraSense Experience",
      type: "ar-video",
      targetFile: "targets.mind",
      sharedImage: "shared.jpg",
      contentFile: "content.mp4",
      autoPlay: true,
      requireContentEnd: false,
      stopOnTargetLost: true,
      transparentBg: true,
      lensUi: true,
      multiTarget: false,
      planeMaxWidth: 1.15,
      planeMaxHeight: 1.15,
      contents: []
    };

    let config = { ...DEFAULT_CONFIG };
    let sceneEl = null;
    let targetVisible = false;
    let activeTargetIndex = null;
    let contentPlaying = false;
    let contentLockedUntilEnd = false;
    let experienceStarted = false;
    let currentMedia = null;

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.innerHTML = `<p>${message}</p><button id="retryButton" onclick="retryExperience()">Riprova</button>`;
      box.style.display = "block";
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("statusText").style.display = "none";
      document.getElementById("lensOverlay").style.display = "none";
    }

    function clearError() {
      const box = document.getElementById("errorBox");
      box.innerHTML = "";
      box.style.display = "none";
    }

    function setStatus(text) {
      const status = document.getElementById("statusText");
      status.textContent = text;
      status.style.display = "block";
    }

    function showLens(show) {
      const lens = document.getElementById("lensOverlay");
      if (!config.lensUi) {
        lens.style.display = "none";
        return;
      }
      lens.style.display = show ? "flex" : "none";
    }

    function isVideo(fileName) {
      const lower = String(fileName || "").toLowerCase();
      return lower.endsWith(".mp4") || lower.endsWith(".webm") || lower.endsWith(".mov") || lower.includes(".mp4?") || lower.includes(".webm?") || lower.includes(".mov?");
    }

    function isAudio(fileName) {
      const lower = String(fileName || "").toLowerCase();
      return lower.endsWith(".mp3") || lower.endsWith(".wav") || lower.endsWith(".m4a") || lower.includes(".mp3?") || lower.includes(".wav?") || lower.includes(".m4a?");
    }

    function isImage(fileName) {
      const lower = String(fileName || "").toLowerCase();
      return lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png") || lower.endsWith(".webp") || lower.includes(".jpg?") || lower.includes(".jpeg?") || lower.includes(".png?") || lower.includes(".webp?");
    }

    function fitPlaneToRatio(plane, naturalWidth, naturalHeight) {
      const maxW = Number(config.planeMaxWidth || 1.15);
      const maxH = Number(config.planeMaxHeight || 1.15);
      if (!naturalWidth || !naturalHeight) {
        plane.setAttribute("width", String(maxW));
        plane.setAttribute("height", String(maxW * 0.5625));
        return;
      }
      const ratio = naturalWidth / naturalHeight;
      let width = maxW;
      let height = width / ratio;
      if (height > maxH) {
        height = maxH;
        width = height * ratio;
      }
      plane.setAttribute("width", String(width));
      plane.setAttribute("height", String(height));
    }

    function getContents() {
      if (Array.isArray(config.contents) && config.contents.length > 0) {
        return config.contents.map((item, index) => ({
          id: Number.isInteger(item.id) ? item.id : index,
          targetId: Number.isInteger(item.targetId) ? item.targetId : index,
          file: item.file || config.contentFile,
          label: item.label || `Contenuto ${index + 1}`,
          kind: item.kind || "video"
        })).filter(item => item.file);
      }
      return [{ id: 0, targetId: 0, file: config.contentFile, label: "Contenuto 1", kind: "video" }].filter(item => item.file);
    }

    async function loadConfig() {
      try {
        const response = await fetch("config.json", { cache: "no-store" });
        if (response.ok) {
          const remoteConfig = await response.json();
          config = { ...DEFAULT_CONFIG, ...remoteConfig };
        }
      } catch (error) {
        console.warn("Config non trovato, uso valori default.", error);
      }
      document.getElementById("experienceTitle").textContent = config.title || DEFAULT_CONFIG.title;
      applyTargetFile(config.targetFile || DEFAULT_CONFIG.targetFile);
      buildTargets();
    }

    function applyTargetFile(targetFile) {
      const scene = document.getElementById("arScene");
      scene.setAttribute("mindar-image", "imageTargetSrc: " + targetFile + "; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;");
    }

    function buildTargets() {
      const assets = document.getElementById("arAssets");
      const root = document.getElementById("targetsRoot");
      assets.innerHTML = "";
      root.innerHTML = "";

      const contents = getContents();
      contents.forEach((content, index) => {
        const fileName = content.file;
        const targetIndex = Number.isInteger(content.targetId) ? content.targetId : index;
        const assetId = `asset-${index}`;
        const planeId = `plane-${index}`;

        let asset;
        let plane;

        if (isVideo(fileName)) {
          asset = document.createElement("video");
          asset.id = assetId;
          asset.className = "arContentAsset";
          asset.src = fileName;
          asset.preload = "auto";
          asset.crossOrigin = "anonymous";
          asset.playsInline = true;
          asset.setAttribute("playsinline", "");
          asset.setAttribute("webkit-playsinline", "");
          asset.addEventListener("loadedmetadata", () => fitPlaneToRatio(plane, asset.videoWidth, asset.videoHeight), { once: true });

          plane = document.createElement("a-video");
          plane.setAttribute("src", `#${assetId}`);
        } else if (isImage(fileName)) {
          asset = document.createElement("img");
          asset.id = assetId;
          asset.className = "arContentAsset";
          asset.src = fileName;
          asset.crossOrigin = "anonymous";
          asset.onload = () => fitPlaneToRatio(plane, asset.naturalWidth, asset.naturalHeight);

          plane = document.createElement("a-image");
          plane.setAttribute("src", `#${assetId}`);
        } else if (isAudio(fileName)) {
          asset = document.createElement("audio");
          asset.id = assetId;
          asset.className = "arContentAsset";
          asset.src = fileName;
          asset.preload = "auto";
          asset.crossOrigin = "anonymous";

          plane = document.createElement("a-entity");
        } else {
          return;
        }

        assets.appendChild(asset);

        const target = document.createElement("a-entity");
        target.id = `target-${targetIndex}`;
        target.setAttribute("mindar-image-target", `targetIndex: ${targetIndex}`);

        plane.id = planeId;
        plane.setAttribute("width", "1");
        plane.setAttribute("height", "1");
        plane.setAttribute("position", "0 0 0.01");
        plane.setAttribute("rotation", "0 0 0");
        plane.setAttribute("visible", isAudio(fileName) ? "false" : "true");
        target.appendChild(plane);
        root.appendChild(target);

        target.addEventListener("targetFound", () => handleTargetFound(content, asset, targetIndex));
        target.addEventListener("targetLost", () => handleTargetLost(targetIndex));
      });
    }

    async function requestCameraPermission() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Questo browser non supporta l'accesso diretto alla fotocamera.");
      }
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      stream.getTracks().forEach(track => track.stop());
    }

    function forceTransparentRuntime() {
      document.documentElement.style.background = "transparent";
      document.body.style.background = "transparent";
      document.querySelectorAll("canvas, .a-canvas, a-scene, .mindar-ui-overlay, .mindar-ui-scanning, .mindar-ui-loading").forEach(el => {
        el.style.background = "transparent";
      });
    }

    async function startExperience() {
      if (experienceStarted) return;
      const button = document.getElementById("startButton");
      button.disabled = true;
      button.textContent = "Avvio fotocamera...";
      clearError();
      try {
        await requestCameraPermission();
        experienceStarted = true;
        document.getElementById("startScreen").style.display = "none";
        forceTransparentRuntime();
        sceneEl = document.querySelector("a-scene");
        await sceneEl.systems["mindar-image-system"].start();
        forceTransparentRuntime();
        setStatus("Inquadra il target");
        showLens(true);
      } catch (error) {
        console.error("Errore avvio esperienza:", error);
        experienceStarted = false;
        button.disabled = false;
        button.textContent = "Avvia esperienza";
        showError("Non riesco ad accedere alla fotocamera. Controlla che il sito abbia il permesso Camera nel browser, poi ricarica e premi di nuovo Avvia esperienza.");
      }
    }

    function retryExperience() {
      document.getElementById("errorBox").style.display = "none";
      document.getElementById("startScreen").style.display = "flex";
      document.getElementById("startButton").disabled = false;
      document.getElementById("startButton").textContent = "Avvia esperienza";
    }

    function handleTargetFound(content, media, targetIndex) {
      targetVisible = true;
      activeTargetIndex = targetIndex;
      if (!config.autoPlay) {
        setStatus("Target trovato. Tocca per avviare.");
        showLens(false);
        return;
      }
      if (contentLockedUntilEnd) return;
      playContent(content, media);
    }

    function handleTargetLost(targetIndex) {
      if (activeTargetIndex !== targetIndex) return;
      targetVisible = false;
      activeTargetIndex = null;
      if (contentLockedUntilEnd) {
        setStatus("Contenuto in riproduzione");
        return;
      }
      if (config.stopOnTargetLost) stopContent();
      setStatus("Inquadra il target");
      showLens(true);
    }

    function playContent(content, media) {
      if (contentPlaying && currentMedia === media) return;
      stopContent();
      currentMedia = media;
      contentPlaying = true;
      contentLockedUntilEnd = config.requireContentEnd === true;
      setStatus(content.label || "Target trovato");
      showLens(false);

      if (media && typeof media.play === "function") {
        try { media.currentTime = 0; } catch (e) {}
        media.play()
          .then(() => setStatus("Contenuto in riproduzione"))
          .catch(() => setStatus("Tocca lo schermo per avviare il contenuto"));
        media.onended = () => {
          contentPlaying = false;
          contentLockedUntilEnd = false;
          currentMedia = null;
          setStatus("Contenuto terminato. Inquadra il target.");
          showLens(true);
        };
        return;
      }

      contentPlaying = false;
      contentLockedUntilEnd = false;
    }

    function stopContent() {
      document.querySelectorAll("video.arContentAsset, audio.arContentAsset").forEach(media => {
        try { media.pause(); media.currentTime = 0; } catch (e) {}
      });
      contentPlaying = false;
      contentLockedUntilEnd = false;
      currentMedia = null;
    }

    document.body.addEventListener("click", () => {
      if (!targetVisible || contentPlaying || activeTargetIndex === null) return;
      const contents = getContents();
      const content = contents.find(item => item.targetId === activeTargetIndex);
      const index = contents.indexOf(content);
      const media = document.getElementById(`asset-${index}`);
      if (content && media) playContent(content, media);
    });

    window.addEventListener("load", async () => {
      await loadConfig();
    });
  </script>
</body>
</html>
