<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MaraSense Experience</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }
    body { position: fixed; inset: 0; }
    a-scene, canvas, .a-canvas, .mindar-ui-overlay, .mindar-ui-scanning, .mindar-ui-loading, .mindar-ui-error {
      background: transparent !important;
    }
    a-scene {
      width: 100vw !important;
      height: 100vh !important;
      background: transparent !important;
    }
    #lensOverlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      background: transparent !important;
    }
    .lensBox {
      width: min(72vw, 330px);
      aspect-ratio: 1 / 1;
      border-radius: 32px;
      position: relative;
    }
    .corner {
      position: absolute;
      width: 58px;
      height: 58px;
      border-color: rgba(255,255,255,.95);
      filter: drop-shadow(0 0 8px rgba(138,43,226,.85));
    }
    .corner.tl { top: 0; left: 0; border-top: 5px solid; border-left: 5px solid; border-radius: 28px 0 0 0; }
    .corner.tr { top: 0; right: 0; border-top: 5px solid; border-right: 5px solid; border-radius: 0 28px 0 0; }
    .corner.bl { bottom: 0; left: 0; border-bottom: 5px solid; border-left: 5px solid; border-radius: 0 0 0 28px; }
    .corner.br { bottom: 0; right: 0; border-bottom: 5px solid; border-right: 5px solid; border-radius: 0 0 28px 0; }
    .scanLine {
      position: absolute;
      left: 10%;
      right: 10%;
      height: 3px;
      top: 18%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #00eaff, #8a2be2, transparent);
      box-shadow: 0 0 18px rgba(0,234,255,.9);
      animation: scanMove 2.2s ease-in-out infinite;
    }
    @keyframes scanMove {
      0% { top: 18%; opacity: .4; }
      50% { top: 82%; opacity: 1; }
      100% { top: 18%; opacity: .4; }
    }
    #statusText {
      position: fixed;
      left: 50%;
      bottom: max(32px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 25;
      width: min(88vw, 420px);
      text-align: center;
      color: white;
      font-size: 15px;
      line-height: 1.4;
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,.42);
      backdrop-filter: blur(12px);
      box-shadow: 0 0 18px rgba(0,0,0,.28);
      display: none;
    }
    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: radial-gradient(circle at top left, rgba(138,43,226,.32), transparent 34%), radial-gradient(circle at bottom right, rgba(0,234,255,.24), transparent 34%), #050505;
      color: white;
      text-align: center;
      padding: 24px;
    }
    #brandLogo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 22px;
      animation: rotateLogo 8s linear infinite;
    }
    @keyframes rotateLogo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    #startScreen h1 { margin: 0 0 10px; font-size: 26px; }
    #startScreen p { margin: 0 0 24px; max-width: 420px; color: #d7d7d7; line-height: 1.5; font-size: 15px; }
    #startButton, #retryButton {
      border: none;
      border-radius: 999px;
      padding: 14px 26px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #8a2be2, #00bcd4);
      box-shadow: 0 0 24px rgba(138,43,226,.38);
    }
    #startButton:disabled { opacity: .6; cursor: wait; }
    #contentStage {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom)) 18px;
      pointer-events: none;
      background: transparent;
    }
    #contentFrame {
      width: min(92vw, 640px);
      max-height: min(76vh, 640px);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      overflow: hidden;
      background: rgba(0,0,0,.16);
      backdrop-filter: blur(2px);
      box-shadow: 0 24px 64px rgba(0,0,0,.26);
    }
    #contentFrame video,
    #contentFrame img {
      width: 100%;
      height: 100%;
      max-height: min(76vh, 640px);
      object-fit: contain;
      display: block;
      background: transparent;
    }
    #errorBox {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 80;
      width: min(88vw, 540px);
      padding: 18px;
      background: rgba(0,0,0,.86);
      color: white;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.16);
      line-height: 1.5;
      text-align: center;
    }
    #errorBox p { margin: 0 0 14px; }
  </style>
</head>
<body>
  <div id="startScreen">
    <img id="brandLogo" src="/MARASENSELOGO.png" onerror="this.src='https://ndaprove.newdigitalapp.it/docs/MARASENSELOGO.png'" alt="MaraSense" />
    <h1 id="experienceTitle">MaraSense Experience</h1>
    <p>Premi il pulsante, consenti l’accesso alla fotocamera e inquadra il target.</p>
    <button id="startButton" onclick="startExperience()">Avvia esperienza</button>
  </div>

  <div id="lensOverlay">
    <div class="lensBox">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanLine"></div>
    </div>
  </div>

  <div id="statusText">Inquadra il target</div>
  <div id="contentStage"><div id="contentFrame"></div></div>
  <div id="errorBox"></div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: targets.mind; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false; alpha: true; antialias: true; logarithmicDepthBuffer: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    background="transparent: true"
  >
    <a-camera position="0 0 0" look-controls="enabled: false" cursor="rayOrigin: mouse"></a-camera>
    <a-entity id="targetsRoot"></a-entity>
  </a-scene>

  <script>
    const DEFAULT_CONFIG = {
      title: "MaraSense Experience",
      type: "ar-video",
      targetFile: "targets.mind",
      sharedImage: "shared.jpg",
      contentFile: "content.mp4",
      autoPlay: true,
      requireContentEnd: false,
      stopOnTargetLost: true,
      transparentBg: true,
      lensUi: true,
      multiTarget: false,
      contents: []
    };

    let config = { ...DEFAULT_CONFIG };
    let sceneEl = null;
    let experienceStarted = false;
    let visibleTargets = new Set();
    let activeContent = null;
    let activePlayback = null;
    let pendingContent = null;
    const contentCache = new Map();

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.innerHTML = `<p>${message}</p><button id="retryButton" onclick="retryExperience()">Riprova</button>`;
      box.style.display = "block";
      document.getElementById("startScreen").style.display = "none";
      document.getElementById("statusText").style.display = "none";
      document.getElementById("lensOverlay").style.display = "none";
    }

    function clearError() {
      const box = document.getElementById("errorBox");
      box.innerHTML = "";
      box.style.display = "none";
    }

    function setStatus(text) {
      const status = document.getElementById("statusText");
      status.textContent = text;
      status.style.display = "block";
    }

    function showLens(show) {
      const lens = document.getElementById("lensOverlay");
      if (!config.lensUi) {
        lens.style.display = "none";
        return;
      }
      lens.style.display = show ? "flex" : "none";
    }

    function forceTransparentRuntime() {
      document.documentElement.style.background = "transparent";
      document.body.style.background = "transparent";
      document.querySelectorAll("canvas, .a-canvas, a-scene, .mindar-ui-overlay, .mindar-ui-scanning, .mindar-ui-loading").forEach((element) => {
        element.style.background = "transparent";
      });
    }

    function isVideo(fileName) {
      const lower = String(fileName || "").toLowerCase();
      return lower.endsWith(".mp4") || lower.endsWith(".webm") || lower.endsWith(".mov") || lower.includes(".mp4?") || lower.includes(".webm?") || lower.includes(".mov?");
    }

    function isAudio(fileName) {
      const lower = String(fileName || "").toLowerCase();
      return lower.endsWith(".mp3") || lower.endsWith(".wav") || lower.endsWith(".m4a") || lower.includes(".mp3?") || lower.includes(".wav?") || lower.includes(".m4a?");
    }

    function isImage(fileName) {
      const lower = String(fileName || "").toLowerCase();
      return lower.endsWith(".jpg") || lower.endsWith(".jpeg") || lower.endsWith(".png") || lower.endsWith(".webp") || lower.includes(".jpg?") || lower.includes(".jpeg?") || lower.includes(".png?") || lower.includes(".webp?");
    }

    function normalizeTargetIds(rawTargetIds, fallbackId) {
      const rawList = Array.isArray(rawTargetIds)
        ? rawTargetIds
        : rawTargetIds === undefined || rawTargetIds === null
          ? [fallbackId]
          : [rawTargetIds];

      const uniqueIds = [];
      rawList.forEach((value) => {
        const parsed = Number.parseInt(String(value), 10);
        if (Number.isInteger(parsed) && parsed >= 0 && !uniqueIds.includes(parsed)) {
          uniqueIds.push(parsed);
        }
      });

      if (uniqueIds.length > 0) {
        return uniqueIds;
      }

      if (Number.isInteger(fallbackId) && fallbackId >= 0) {
        return [fallbackId];
      }

      return [0];
    }

    function getContents() {
      if (Array.isArray(config.contents) && config.contents.length > 0) {
        return config.contents.map((item, index) => {
          const targetIds = normalizeTargetIds(item.targetIds, item.targetId ?? index);
          const file = item.file || config.contentFile;
          const inferredKind = item.kind || (isAudio(file) ? "audio" : isImage(file) ? "image" : "video");
          return {
            id: Number.isInteger(item.id) ? item.id : index,
            label: item.label || `Contenuto ${index + 1}`,
            targetIds,
            targetId: targetIds[0],
            file,
            kind: inferredKind,
            originalFile: item.originalFile || "",
            audioFile: item.audioFile || "",
            audioOriginalFile: item.audioOriginalFile || ""
          };
        }).filter((item) => item.file);
      }

      return [{
        id: 0,
        label: "Contenuto 1",
        targetIds: [0],
        targetId: 0,
        file: config.contentFile,
        kind: isAudio(config.contentFile) ? "audio" : "video",
        audioFile: ""
      }].filter((item) => item.file);
    }

    function getUniqueTargetIds(contents) {
      return [...new Set(contents.flatMap((content) => content.targetIds))].sort((a, b) => a - b);
    }

    function applyTargetFile(targetFile) {
      const scene = document.getElementById("arScene");
      scene.setAttribute(
        "mindar-image",
        "imageTargetSrc: " + targetFile + "; autoStart: false; filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10;"
      );
    }

    function buildTargets() {
      const root = document.getElementById("targetsRoot");
      root.innerHTML = "";
      const contents = getContents();

      getUniqueTargetIds(contents).forEach((targetId) => {
        const target = document.createElement("a-entity");
        target.id = `target-${targetId}`;
        target.setAttribute("mindar-image-target", `targetIndex: ${targetId}`);
        target.addEventListener("targetFound", () => handleTargetFound(targetId));
        target.addEventListener("targetLost", () => handleTargetLost(targetId));
        root.appendChild(target);
      });
    }

    function getContentForTarget(targetId) {
      return getContents().find((content) => content.targetIds.includes(targetId)) || null;
    }

    function buildPlaybackBundle(content) {
      if (contentCache.has(content.id)) {
        return contentCache.get(content.id);
      }

      const bundle = {
        content,
        visual: null,
        audio: null,
        frameElement: null
      };

      if (content.kind === "image") {
        const image = document.createElement("img");
        image.src = content.file;
        image.alt = content.label || "MaraSense content";
        image.crossOrigin = "anonymous";
        bundle.visual = image;
        bundle.frameElement = image;
      } else if (content.kind === "audio") {
        const audio = new Audio(content.file);
        audio.preload = "auto";
        audio.crossOrigin = "anonymous";
        bundle.audio = audio;
      } else {
        const video = document.createElement("video");
        video.src = content.file;
        video.preload = "auto";
        video.crossOrigin = "anonymous";
        video.setAttribute("playsinline", "");
        video.setAttribute("webkit-playsinline", "");
        video.playsInline = true;
        video.controls = false;
        video.disablePictureInPicture = true;
        bundle.visual = video;
        bundle.frameElement = video;

        if (content.audioFile) {
          const audio = new Audio(content.audioFile);
          audio.preload = "auto";
          audio.crossOrigin = "anonymous";
          bundle.audio = audio;
          video.muted = true;
          video.defaultMuted = true;
        }
      }

      contentCache.set(content.id, bundle);
      return bundle;
    }

    function mountBundle(bundle) {
      const stage = document.getElementById("contentStage");
      const frame = document.getElementById("contentFrame");
      frame.innerHTML = "";

      if (bundle.frameElement) {
        frame.appendChild(bundle.frameElement);
      }

      stage.style.display = bundle.frameElement ? "flex" : "none";
    }

    function resetBundle(bundle) {
      if (!bundle) return;
      [bundle.visual, bundle.audio].forEach((media) => {
        if (!media) return;
        try {
          media.pause();
          media.currentTime = 0;
        } catch (error) {
          console.warn("Reset media non riuscito", error);
        }
      });
    }

    function clearStage() {
      const stage = document.getElementById("contentStage");
      const frame = document.getElementById("contentFrame");
      frame.innerHTML = "";
      stage.style.display = "none";
    }

    function stopActivePlayback(clearVisual = true) {
      if (activePlayback) {
        resetBundle(activePlayback);
      }
      if (clearVisual) {
        clearStage();
      }
      activePlayback = null;
      activeContent = null;
    }

    function finishPlayback() {
      stopActivePlayback(true);
      pendingContent = null;
      if (visibleTargets.size > 0) {
        setStatus("Target ancora inquadrato. Puoi cambiare target oppure ripetere.");
      } else {
        setStatus("Contenuto terminato. Inquadra di nuovo il target.");
      }
      showLens(true);
    }

    async function playBundle(bundle) {
      mountBundle(bundle);
      const playTasks = [];

      if (bundle.visual && typeof bundle.visual.play === "function") {
        bundle.visual.currentTime = 0;
        playTasks.push(bundle.visual.play());
        bundle.visual.onended = () => {
          if (!bundle.audio) {
            finishPlayback();
          }
        };
      }

      if (bundle.audio) {
        bundle.audio.currentTime = 0;
        playTasks.push(bundle.audio.play());
        bundle.audio.onended = () => {
          if (bundle.content.kind === "audio" || !bundle.visual) {
            finishPlayback();
          }
        };
      }

      if (bundle.visual && bundle.audio && bundle.visual.duration && bundle.audio.duration) {
        bundle.audio.currentTime = bundle.visual.currentTime;
      }

      const results = await Promise.allSettled(playTasks);
      const blocked = results.some((result) => result.status === "rejected");

      if (blocked) {
        pendingContent = bundle.content;
        setStatus("Tocca lo schermo per avviare il contenuto.");
        return;
      }

      pendingContent = null;
      setStatus("Contenuto in riproduzione");
    }

    async function activateContent(content) {
      const sameContent = activeContent && activeContent.id === content.id;
      if (sameContent) {
        return;
      }

      stopActivePlayback(false);
      const bundle = buildPlaybackBundle(content);
      activeContent = content;
      activePlayback = bundle;
      showLens(false);
      setStatus(content.label || "Target trovato");
      await playBundle(bundle);
    }

    function handleTargetFound(targetId) {
      visibleTargets.add(targetId);
      const content = getContentForTarget(targetId);
      if (!content) {
        return;
      }

      if (!config.autoPlay) {
        pendingContent = content;
        showLens(false);
        setStatus("Target trovato. Tocca lo schermo per avviare.");
        return;
      }

      if (config.requireContentEnd && activePlayback) {
        return;
      }

      activateContent(content);
    }

    function handleTargetLost(targetId) {
      visibleTargets.delete(targetId);

      if (!activeContent) {
        if (visibleTargets.size === 0) {
          setStatus("Inquadra il target");
          showLens(true);
        }
        return;
      }

      const stillVisible = activeContent.targetIds.some((id) => visibleTargets.has(id));
      if (stillVisible) {
        return;
      }

      if (config.requireContentEnd && activePlayback) {
        setStatus("Contenuto in riproduzione");
        return;
      }

      if (config.stopOnTargetLost) {
        stopActivePlayback(true);
      }

      setStatus("Inquadra il target");
      showLens(true);
    }

    async function requestCameraPermission() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        throw new Error("Questo browser non supporta l'accesso diretto alla fotocamera.");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      stream.getTracks().forEach((track) => track.stop());
    }

    async function loadConfig() {
      try {
        const response = await fetch("config.json", { cache: "no-store" });
        if (response.ok) {
          const remoteConfig = await response.json();
          config = { ...DEFAULT_CONFIG, ...remoteConfig };
        }
      } catch (error) {
        console.warn("Config non trovato, uso valori default.", error);
      }

      document.getElementById("experienceTitle").textContent = config.title || DEFAULT_CONFIG.title;
      applyTargetFile(config.targetFile || DEFAULT_CONFIG.targetFile);
      buildTargets();
    }

    async function startExperience() {
      if (experienceStarted) return;
      const button = document.getElementById("startButton");
      button.disabled = true;
      button.textContent = "Avvio fotocamera...";
      clearError();

      try {
        await requestCameraPermission();
        experienceStarted = true;
        document.getElementById("startScreen").style.display = "none";
        forceTransparentRuntime();
        sceneEl = document.querySelector("a-scene");
        await sceneEl.systems["mindar-image-system"].start();
        forceTransparentRuntime();
        setStatus("Inquadra il target");
        showLens(true);
      } catch (error) {
        console.error("Errore avvio esperienza:", error);
        experienceStarted = false;
        button.disabled = false;
        button.textContent = "Avvia esperienza";
        showError("Non riesco ad accedere alla fotocamera. Controlla il permesso Camera del browser e riprova.");
      }
    }

    function retryExperience() {
      document.getElementById("errorBox").style.display = "none";
      document.getElementById("startScreen").style.display = "flex";
      document.getElementById("startButton").disabled = false;
      document.getElementById("startButton").textContent = "Avvia esperienza";
      stopActivePlayback(true);
      pendingContent = null;
      visibleTargets = new Set();
      showLens(false);
    }

    document.body.addEventListener("click", async () => {
      if (!pendingContent) {
        return;
      }
      const content = pendingContent;
      pendingContent = null;
      await activateContent(content);
    });

    window.addEventListener("load", async () => {
      await loadConfig();
    });
  </script>
</body>
</html>
