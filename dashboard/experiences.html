<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MaraSense - Esperienze</title>
  <link rel="icon" href="https://ndaprove.newdigitalapp.it/docs/MARASENSELOGO.png" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at top left, rgba(138,43,226,.08), transparent 35%), radial-gradient(circle at bottom right, rgba(0,234,255,.06), transparent 35%), #f5f7fb; color: #111; font-family: Arial, Helvetica, sans-serif; }
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 18px 48px; }
    .header, .card { background: rgba(255,255,255,.96); border: 1px solid rgba(0,0,0,.06); border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,.05); }
    .header { display: flex; align-items: center; gap: 18px; padding: 22px; margin-bottom: 18px; }
    .header img { width: 74px; height: 74px; object-fit: contain; animation: rotateLogo 8s linear infinite; }
    @keyframes rotateLogo { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    h1 { margin: 0; font-size: 30px; }
    p { color: #666; line-height: 1.5; }
    .card { padding: 20px; margin-bottom: 18px; }
    .toolbar { display: grid; grid-template-columns: 1fr 180px 180px auto; gap: 12px; align-items: end; }
    label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 800; color: #444; }
    input, select { width: 100%; border: 1px solid #d8dde7; border-radius: 14px; padding: 12px 14px; background: #fff; color: #111; font-size: 14px; outline: none; }
    button, .button-link { border: none; border-radius: 14px; padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 800; color: white; background: linear-gradient(135deg,#8a2be2,#00bcd4); box-shadow: 0 8px 24px rgba(138,43,226,.20); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    button.secondary, .button-link.secondary { background: #fff; color: #111; border: 1px solid #d7dde7; box-shadow: none; }
    .status { min-height: 20px; color: #00a6bc; font-size: 14px; margin-top: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 13px 10px; border-bottom: 1px solid #e7ebf3; vertical-align: top; text-align: left; font-size: 14px; }
    th { color: #475569; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .name { font-weight: 900; color: #111; }
    .muted { color: #64748b; font-size: 12px; margin-top: 4px; word-break: break-word; }
    .pill { display: inline-flex; padding: 5px 9px; border-radius: 999px; background: #f1f5f9; color: #334155; font-size: 12px; font-weight: 800; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions a, .actions button { padding: 8px 10px; border-radius: 10px; font-size: 12px; box-shadow: none; }
    .qr-cell img { width: 78px; height: 78px; background: #fff; border: 1px solid #e7ebf3; border-radius: 12px; padding: 6px; }
    .empty { padding: 18px; border: 1px dashed #cbd5e1; border-radius: 16px; color: #64748b; background: #fff; }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 900px) { .toolbar { grid-template-columns: 1fr; } .header { align-items: flex-start; } th, td { min-width: 130px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="header">
      <img src="https://ndaprove.newdigitalapp.it/docs/MARASENSELOGO.png" alt="MaraSense Logo" />
      <div>
        <h1>MaraSense Esperienze</h1>
        <p>Elenco operativo delle esperienze create: apri, modifica, prova da QR e controlla target/contenuti.</p>
      </div>
    </section>
    <section class="card">
      <div class="toolbar">
        <div><label for="searchInput">Cerca</label><input id="searchInput" type="search" placeholder="Nome, settore, slug..." /></div>
        <div><label for="sectorFilter">Settore</label><select id="sectorFilter"><option value="">Tutti</option></select></div>
        <div><label for="typeFilter">Tipo</label><select id="typeFilter"><option value="">Tutti</option></select></div>
        <div class="actions"><button onclick="loadExperiences()">Aggiorna</button><a class="button-link secondary" href="./">Nuova esperienza</a></div>
      </div>
      <div class="status" id="status"></div>
    </section>
    <section class="card"><div class="table-wrap" id="tableWrap"></div></section>
  </main>
  <script>
    const BASE_URL = "https://marasenseexperiences-ar.web.app";
    const INDEX_URL = `${BASE_URL}/managed-experiences/index.json`;
    let allExperiences = [];
    function escapeHtml(value) { return String(value || "").replace(/[&<>'"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
    function getPublicUrl(item) { return item.publicUrl || item.meta?.publicUrl || `${BASE_URL}/${item.folder || ""}`; }
    function getUpdatedAt(item) { return item.updatedAt || item.meta?.updatedAt || item.createdAt || item.meta?.createdAt || ""; }
    function formatDate(value) { if (!value) return "-"; try { return new Intl.DateTimeFormat("it-IT", { dateStyle: "short", timeStyle: "short" }).format(new Date(value)); } catch { return value; } }
    function qrUrl(link) { return `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(link)}`; }
    function populateFilters() { const sectors = [...new Set(allExperiences.map((item) => item.sector).filter(Boolean))].sort(); const types = [...new Set(allExperiences.map((item) => item.type).filter(Boolean))].sort(); document.getElementById("sectorFilter").innerHTML = '<option value="">Tutti</option>' + sectors.map((sector) => `<option value="${escapeHtml(sector)}">${escapeHtml(sector)}</option>`).join(""); document.getElementById("typeFilter").innerHTML = '<option value="">Tutti</option>' + types.map((type) => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join(""); }
    function getFilteredExperiences() { const query = document.getElementById("searchInput").value.trim().toLowerCase(); const sector = document.getElementById("sectorFilter").value; const type = document.getElementById("typeFilter").value; return allExperiences.filter((item) => { const haystack = [item.id, item.name, item.title, item.slug, item.sector, item.type].join(" ").toLowerCase(); if (query && !haystack.includes(query)) return false; if (sector && item.sector !== sector) return false; if (type && item.type !== type) return false; return true; }); }
    function renderTable() { const list = getFilteredExperiences(); const wrap = document.getElementById("tableWrap"); document.getElementById("status").textContent = `${list.length} esperienze visualizzate su ${allExperiences.length}.`; if (list.length === 0) { wrap.innerHTML = '<div class="empty">Nessuna esperienza trovata.</div>'; return; } wrap.innerHTML = `<table><thead><tr><th>Esperienza</th><th>Settore</th><th>Target / contenuti</th><th>Ultima modifica</th><th>QR</th><th>Azioni</th></tr></thead><tbody>${list.map((item) => { const publicUrl = getPublicUrl(item); const id = item.id || `${item.sector}/${item.slug}`; const targetCount = Array.isArray(item.targetImages) ? item.targetImages.length : 0; const contentCount = Array.isArray(item.contents) ? item.contents.length : 0; return `<tr><td><div class="name">${escapeHtml(item.name || item.title || id)}</div><div class="muted">${escapeHtml(id)}</div></td><td><span class="pill">${escapeHtml(item.sector || "-")}</span><div class="muted">${escapeHtml(item.type || "-")}</div></td><td>${targetCount} target<br><span class="muted">${contentCount} contenuti</span></td><td>${formatDate(getUpdatedAt(item))}</td><td class="qr-cell"><a href="./demo.html?id=${encodeURIComponent(id)}" target="_blank"><img src="${qrUrl(publicUrl)}" alt="QR" /></a></td><td><div class="actions"><a class="button-link" href="${publicUrl}" target="_blank">Apri</a><a class="button-link secondary" href="./?id=${encodeURIComponent(id)}">Modifica</a><a class="button-link secondary" href="./demo.html?id=${encodeURIComponent(id)}" target="_blank">Demo</a><button class="secondary" onclick="copyText('${publicUrl.replace(/'/g, "\\'")}')">Copia</button></div></td></tr>`; }).join("")}</tbody></table>`; }
    async function copyText(text) { try { await navigator.clipboard.writeText(text); document.getElementById("status").textContent = "Link copiato."; } catch { document.getElementById("status").textContent = "Copia manualmente il link."; } }
    async function loadExperiences() { const status = document.getElementById("status"); status.textContent = "Caricamento esperienze..."; try { const response = await fetch(INDEX_URL, { cache: "no-store" }); allExperiences = await response.json(); allExperiences.sort((a, b) => String(getUpdatedAt(b)).localeCompare(String(getUpdatedAt(a)))); populateFilters(); renderTable(); } catch (error) { console.error(error); status.textContent = "Errore caricamento esperienze: " + error.message; document.getElementById("tableWrap").innerHTML = '<div class="empty">Errore caricamento dati.</div>'; } }
    document.getElementById("searchInput").addEventListener("input", renderTable);
    document.getElementById("sectorFilter").addEventListener("change", renderTable);
    document.getElementById("typeFilter").addEventListener("change", renderTable);
    window.addEventListener("load", loadExperiences);
  </script>
</body>
</html>
